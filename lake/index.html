<!DOCTYPE html>
<html>
<head>
    <base href="/examples/lake/">
    <meta charset="utf-8">
    <title>Kansei — Lake</title>
    <link rel="icon" href="data:,">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #hud {
            position: fixed; top: 12px; left: 14px; margin: 0; max-width: 90vw;
            color: #f2f2f2; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
            text-shadow: 0 1px 2px #000, 0 0 6px #000; white-space: pre-wrap; pointer-events: none;
        }
        /* the cannon's prompt: always shown (there is no character to walk up to it), and a click
           (or touch) on it fires */
        #prompt {
            position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
            padding: 8px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.55);
            color: #f2f2f2; font: 14px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
            cursor: pointer; user-select: none; touch-action: none;
        }
        #prompt:not([data-visible="1"]) { display: none; }
    </style>
</head>
<body>
    <canvas id="kansei" tabindex="0"></canvas>
    <pre id="hud"></pre>
    <div id="prompt"></div>
    <script type="module">
        import init, { start, lake_settings, lake_set, lake_reset, lake_surface, lake_surface_preset, lake_fill, lake_regions, mill_settings, cannon_fire } from './pkg/kansei_wasm_lake.js';
        import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js';
        await init();
        // the cannon's prompt fires while pressed (the keyboard's E and the gamepad's X work too)
        const prompt = document.getElementById('prompt');
        prompt.addEventListener('pointerdown', (e) => { e.preventDefault(); cannon_fire(true); });
        for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) prompt.addEventListener(ev, () => cannon_fire(false));
        await start('kansei');
        // debug=1: the lake's particles by region, read back from the GPU (await lakeRegions())
        if (['1', 'true', 'on', 'yes'].includes(new URLSearchParams(location.search).get('debug'))) window.lakeRegions = lake_regions;

        // The lake's tweak panel: P shows and hides it.
        const p = lake_settings();
        if (p) {
            const pane = new Pane({ title: 'Lake (P to hide)' });
            pane.hidden = true;
            window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'p' && !e.repeat) pane.hidden = !pane.hidden; });

            const bind = (folder, key, opts) => folder.addBinding(p, key, opts).on('change', (ev) => lake_set(key, ev.value));
            const solver = pane.addFolder({ title: 'solver' });
            let pbf, sph;
            solver.addBinding(p, 'solver', { options: { 'SPH': 0, 'PBF (position based)': 1 } }).on('change', (ev) => {
                lake_set('solver', ev.value);
                Object.assign(p, lake_settings());
                pane.refresh();
                pbf.hidden = ev.value !== 1;
                sph.hidden = ev.value === 1;
            });
            pbf = solver.addFolder({ title: 'position based fluids' });
            bind(pbf, 'pbfIterations', { label: 'iterations', min: 1, max: 12, step: 1 });
            bind(pbf, 'pbfRelaxation', { label: 'relaxation ε', min: 0.1, max: 50, step: 0.1 });
            bind(pbf, 'pbfScorrK', { label: 's_corr k', min: 0, max: 0.5, step: 0.005 });
            bind(pbf, 'pbfScorrN', { label: 's_corr n', min: 1, max: 8, step: 1 });
            bind(pbf, 'pbfXsph', { label: 'XSPH c', min: 0, max: 0.5, step: 0.005 });
            bind(pbf, 'pbfVorticity', { label: 'vorticity', min: 0, max: 20, step: 0.1 });
            pbf.hidden = p.solver !== 1;
            const water = pane.addFolder({ title: 'water' });
            sph = pane.addFolder({ title: 'SPH' });
            sph.hidden = p.solver === 1;
            bind(sph, 'viscosity', { min: 0, max: 2, step: 0.01 });
            bind(sph, 'negativePressure', { label: 'tensile (neg. pressure)', min: 0, max: 1, step: 0.01 });
            bind(sph, 'pressure', { label: 'stiffness', min: 5, max: 100, step: 0.5 });
            bind(sph, 'nearPressure', { label: 'near stiffness', min: 0, max: 60, step: 0.5 });
            bind(sph, 'restDensity', { label: 'rest density', min: 4, max: 14, step: 0.1 });
            bind(water, 'substeps', { min: 1, max: 8, step: 1 });
            bind(water, 'timeScale', { label: 'time scale', min: 0.5, max: 6, step: 0.05 });
            bind(water, 'friction', { label: 'bed friction', min: 0, max: 0.2, step: 0.001 });
            bind(water, 'drag', { label: 'leg drag', min: 0, max: 1, step: 0.01 });
            bind(water, 'splash', { label: 'landing splash', min: 0, max: 4, step: 0.05 });
            const rest = { rest: p.rest === 1 };
            water.addBinding(rest, 'rest', { label: 'rest (culled, asleep)' }).on('change', (ev) => lake_set('rest', ev.value ? 1 : 0));
            water.addButton({ title: 'reset water (drain)' }).on('click', () => lake_reset());
            // how full the cannon has made it
            const fill = { fill: '' };
            water.addBinding(fill, 'fill', { label: 'filled', readonly: true, interval: 250 });
            setInterval(() => {
                const f = lake_fill();
                if (f) fill.fill = `${Math.round(f.fill * 100)}% · ${f.particles}`;
            }, 250);

            const m = mill_settings();
            if (m) {
                const mill = pane.addFolder({ title: 'water mill' });
                const on = { mill: m.mill === 1, millRpm: m.millRpm };
                mill.addBinding(on, 'mill', { label: 'turning' }).on('change', (ev) => lake_set('mill', ev.value ? 1 : 0));
                mill.addBinding(on, 'millRpm', { label: 'speed (rpm)', min: 0, max: 40, step: 1 }).on('change', (ev) => lake_set('millRpm', ev.value));
            }

            const surface = pane.addFolder({ title: 'surface' });
            const preset = { preset: 'droplets' };
            const apply = () => lake_surface(p.surfaceField, p.resolution, p.kernel, p.particleRadius, p.iso, p.interpolate);
            surface.addBinding(preset, 'preset', { options: { 'Surface field, droplets': 'droplets', 'Density iso, smooth': 'smooth', 'Performance': 'performance' } })
                .on('change', (ev) => { Object.assign(p, lake_surface_preset(ev.value)); pane.refresh(); });
            surface.addBinding(p, 'surfaceField', { label: 'surface field' }).on('change', apply);
            surface.addBinding(p, 'iso', { label: 'iso level', min: 0.02, max: 2, step: 0.01 }).on('change', apply);
            surface.addBinding(p, 'kernel', { label: 'kernel radius', min: 0.8, max: 2.5, step: 0.05 }).on('change', apply);
            surface.addBinding(p, 'particleRadius', { label: 'particle radius', min: 0.2, max: 1, step: 0.01 }).on('change', apply);
            surface.addBinding(p, 'resolution', { label: 'grid resolution', min: 96, max: 384, step: 32 }).on('change', apply);
            surface.addBinding(p, 'interpolate', { label: 'interpolate' }).on('change', apply);
        }
    </script>
</body>
</html>
