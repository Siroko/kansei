<!DOCTYPE html>
<html>
<head>
    <base href="/examples/depth-of-field/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kansei — Depth of Field</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="kansei"></canvas>
    <script type="module">
        // The Rust twin of examples/index_dof_terrain.html. URL parameters (as the TS page's):
        //   dof=simple       the simple DoF (a focus range and a blur in pixels) instead of the cinematic one; dof=0 none
        //   focal=<mm>       the lens' focal length on the 23.76 mm filmback (default 450); the view's fov frames the picture
        //   fstop=<N>        f-number (default 1.4)
        //   focus=<units>    focus distance, view depth (default the view's, 101.5)
        //   blades=<n>       aperture blades (default 0: round bokeh)
        //   samples=<n>      gather samples per half-resolution pixel (default 72)
        //   scatter=0        gather the highlights too instead of scattering them as bokeh sprites
        //   debug=<1..4>     1 background layer, 2 near layer, 3 near alpha, 4 CoC
        //   t=<seconds>      fix the scroll at this time, for stills
        //   view=<JSON>      the opening view ('Copy view' or the V key; views copied on the TS page open here too)
        //   dpr=<ratio>      drawing-buffer pixels per CSS pixel (default 1, as the TS page)
        import init, { start, view, set } from './pkg/kansei_wasm_depth_of_field.js';
        await init();
        await start('kansei');

        const params = new URLSearchParams(location.search);
        // the engine's state: the opening view, the lens, and (for the panel) the cinematic DoF's settings
        const read = () => JSON.parse(view());
        const s = read();
        const mode = s.mode;

        // ?view= over the opening view; focus= overrides its focus distance, as on the TS page
        const applyView = (v) => {
            for (const key of ['radius', 'azimuth', 'elevation', 'fov', 'focusDistance', 'focusRange', 'maxBlur', 'fStop', 'focalLength', 'blades']) {
                if (Number.isFinite(v[key])) set(key, v[key]);
            }
            if (Array.isArray(v.target)) ['targetX', 'targetY', 'targetZ'].forEach((key, i) => set(key, v.target[i]));
        };
        const viewParam = params.get('view');
        if (viewParam) {
            try {
                const v = JSON.parse(viewParam);
                if (params.has('focus')) delete v.focusDistance;
                applyView(v);
            } catch (err) {
                console.warn('Ignoring ?view=, it is not valid JSON:', err);
            }
        }

        const { Pane } = await import('https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js');
        const pane = new Pane({ title: mode === 'simple' ? 'Depth of field (simple)' : 'Depth of field' });
        const p = read();
        const bind = (key, options) => pane.addBinding(p, key, options).on('change', (e) => set(key, typeof e.value === 'boolean' ? Number(e.value) : e.value));
        if (mode === 'simple') {
            bind('focusDistance', { min: 1, max: 150, step: 0.5, label: 'focus distance' });
            bind('focusRange', { min: 1, max: 80, step: 0.5, label: 'focus range' });
            bind('maxBlur', { min: 0, max: 32, step: 1, label: 'max blur' });
        } else if (mode === 'cinematic') {
            bind('focusDistance', { min: 1, max: 300, step: 0.5, label: 'focus distance' });
            bind('fStop', { min: 0.7, max: 22, step: 0.1, label: 'f-stop' });
            bind('focalLength', { min: 10, max: 600, step: 1, label: 'focal length (mm)' });
            bind('blades', { min: 0, max: 9, step: 1, label: 'blades' });
            bind('bladeRotation', { min: 0, max: 90, step: 1, label: 'blade rotation' });
            bind('samples', { min: 8, max: 128, step: 1, label: 'samples' });
            bind('scatter', { label: 'scatter highlights' });
            bind('debug', { label: 'debug view', options: { image: 0, background: 1, near: 2, 'near alpha': 3, CoC: 4 } });
        }
        if (window.innerWidth < 768) pane.expanded = false;

        // 'Copy view' (or the V key) copies the current view, in the TS page's shape; open either
        // page with ?view=<that JSON> to restore it
        async function copyView() {
            const { radius, azimuth, elevation, target, fov, focusDistance, focusRange, maxBlur, fStop, focalLength, blades } = read();
            const v = { radius, azimuth, elevation, target, fov, focusDistance, focusRange, maxBlur, fStop, focalLength, blades };
            const json = JSON.stringify(v);
            const url = `${location.origin}${location.pathname}?view=${encodeURIComponent(json)}`;
            console.log('Kansei DoF terrain view:\n' + JSON.stringify(v, null, 2) + '\n' + url);
            try {
                await navigator.clipboard.writeText(JSON.stringify({ ...v, url }, null, 2));
                copyButton.title = 'Copied';
            } catch {
                copyButton.title = 'See console';
            }
            setTimeout(() => (copyButton.title = 'Copy view'), 1500);
        }
        const copyButton = pane.addButton({ title: 'Copy view' });
        copyButton.on('click', copyView);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'v' && !e.metaKey && !e.ctrlKey && !e.altKey) copyView();
        });

        // for scripted captures: window.kansei.set('focusDistance', 80)
        window.kansei = { view: read, set };
    </script>
</body>
</html>
