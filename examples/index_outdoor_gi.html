<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kansei - outdoor GI</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #panel {
      position: fixed; right: 12px; top: 12px; color: #ddd; font: 12px/1.6 monospace;
      background: rgba(0, 0, 0, 0.6); padding: 8px 10px; border-radius: 4px;
    }
    #panel label { display: flex; justify-content: space-between; gap: 10px; }
    #panel select, #panel input { font: inherit; }
    #stats { position: fixed; left: 8px; top: 8px; margin: 0; padding: 6px 8px; color: #e8f0ff; font: 12px/1.35 ui-monospace, Menlo, monospace;
      background: rgba(0, 0, 0, 0.6); white-space: pre; display: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #aab; font: 13px/1.5 ui-monospace, Menlo, monospace; pointer-events: none; }
  </style>
</head>

<body>
  <div id="loading">loading the Raggare intro's forest…</div>
  <div id="panel">
    <label>gi <select id="gi"><option value="off">off (sky unoccluded)</option><option value="skyocc">top-down sky occlusion</option><option value="visibility">clipmap sky visibility</option><option value="cones">voxel GI, cones</option><option value="probes">voxel GI, probes</option><option value="ssgi">screen-space GI</option><option value="rt">hybrid RT (grid rays + SVGF)</option></select></label>
    <label>view <select id="view"><option>lit</option><option>indirect</option><option>voxels</option></select></label>
    <label>camera <select id="cam"><option>canopy</option><option>trunks</option><option>branches</option><option>lake</option><option>headlights</option><option>departure</option><option>rise</option><option value="film">the film's shots</option><option value="drive">drive along the road</option></select></label>
    <label>sun <input type="range" id="elevation" min="-4" max="60" step="0.5"></label>
    <div id="rtgi-panel" style="display: none">
      <b>hybrid RT GI</b>
      <label>trace <select id="rtgi-res"><option value="half">half (1 ray / 2x2)</option><option value="full">full (1 ray / pixel)</option></select></label>
      <label>near field (m) <input type="range" id="rtgi-near" min="0" max="32" step="1"></label>
      <label>denoise <select id="rtgi-denoise"><option value="svgf">SVGF</option><option value="temporal">temporal only</option><option value="off">off (1 spp)</option></select></label>
      <label>wavelet <select id="rtgi-kernel"><option>3x3</option><option>5x5</option></select></label>
      <label>hits lit by <select id="rtgi-hit"><option value="direct">direct light + voxel cone</option><option value="voxels">voxels only</option></select></label>
      <label>hit shadows <select id="rtgi-shadows"><option value="rays">rays</option><option value="maps">shadow maps</option></select></label>
      <label>mode <select id="rtgi-mode"><option value="hybrid">hybrid</option><option value="reference">reference (path traced)</option></select></label>
      <label>accumulate <input type="checkbox" id="rtgi-accum"></label>
      <label>debug view <select id="rtgi-view"><option>lit</option><option>indirect</option><option>signal</option><option>variance</option><option>history</option><option>cost</option></select></label>
    </div>
  </div>
  <pre id="stats"></pre>
  <script type="module">
    // Outdoor GI: the Rust `outdoor-gi` example (rust/kansei-wasm/examples/outdoor-gi) on the TS
    // engine. The Raggare intro's forest under a low sun, with voxel GI in a clipmap round the
    // camera (`Renderer.enableVoxelClipmap`): the sky's light reaches the forest floor and the road
    // only where the canopy lets it through, and the sunlit ground and trees light what lies in
    // their shade.
    //
    // The scene is the film's, fetched at load from where raggare.kansei.graphics serves it
    // (data=<base URL> for another copy): its terrain, splat and road, its 26 390 spruces and
    // birches and its verge, with the CC0 ground and asphalt scans (ambientCG). The trees, the
    // ground cover and the materials are the film renderer's own procedural ones, shared with the
    // Rust example: the generators in ./forest/*.js (ports of its tree_*.rs and cover_*.rs)
    // and the WGSL in ./forest/*.wgsl. Per species three LODs, culled on the GPU per view with
    // dithered crossfades, the spruces' foliage as card clusters near the camera and an impostor
    // baked from LOD0 far off, their bands set each frame for the lens.
    //
    // The GI modes (gi=) compare what lights the shade: `off` the materials' own sky light (the
    // whole sky); `skyocc` that dimmed by the top-down sky occlusion (`enableSkyOcclusion`);
    // `visibility` dimmed by the sky visibility the clipmap's probes measure, in the material;
    // `cones` voxel GI on screen, six cones a pixel through the clipmap; `probes` the same light
    // from the clipmap's irradiance probes; `ssgi` screen-space GI (`ScreenSpaceGIEffect`); `rt`
    // (the default) the hybrid (`RtDiffuseGiEffect.withClipmap`): one ray for each 2 x 2 pixels
    // through the grid of the scene's triangles round the camera (the foliage alpha-tested) for
    // 8 m, then the clipmap and the sky; denoised by SVGF. With `reflect=1` the road and the lake
    // are wet and reflect the forest, traced through the grid (`RtReflectionsEffect.withClipmap`).
    //
    // URL parameters, as the Rust example's (its README lists them): gi=, rtgi_near and the other
    // rtgi_* settings, view=lit|indirect|voxels, cam=drive (the default)|canopy|trunks|branches|
    // lake|headlights|departure|rise|film, elevation=, bearing=, ev=, fog=, lod=, shadow_lod=, shadow_res=,
    // card_error=, impostor_shadows=0, hide=<labels>, levels=, res=, vox=, lit=, probes=,
    // coneshadows=, bounce=, shadowsteps=, intensity=, shadow_far=, ssgi_radius=, reflect=1 (wet=all,
    // wet_f0, wet_rough, rt_view, rt_trace=voxels, rt_alpha=0, rt_res=quarter), rt=1, rt_cell=,
    // rt_rebuild=1, data=<base URL>, stats=1, ui=0, dpr=; profile=1 and bench=1 through
    // profile-hud.js. `window.kansei` holds the setters and `info()`.
    import { Canvas, run, param, paramOr, flag, setText, fetchBytes } from '../src/web/index'
    import { Camera } from '../src/cameras/Camera'
    import { CameraControls } from '../src/controls/CameraControls'
    import { Scene } from '../src/objects/Scene'
    import { Renderable } from '../src/objects/Renderable'
    import { Material } from '../src/materials/Material'
    import { BindingLayouts } from '../src/materials/Binding'
    import { ComputeBuffer } from '../src/buffers/ComputeBuffer'
    import { BufferBase } from '../src/buffers/BufferBase'
    import { Geometry } from '../src/buffers/Geometry'
    import { Texture } from '../src/buffers/Texture'
    import { Sampler } from '../src/buffers/Sampler'
    import { InstancedGeometry } from '../src/geometries/InstancedGeometry'
    import { DirectionalLight } from '../src/lights/DirectionalLight'
    import { Vector3 } from '../src/math/Vector3'
    import { Vector4 } from '../src/math/Vector4'
    import { InstanceCulling, LOD_FADE_WGSL } from '../src/culling/InstanceCulling'
    import { ClusterMesh } from '../src/clusters/ClusterMesh'
    import { ClusterLod } from '../src/clusters/ClusterLod'
    import { IMPOSTOR_WGSL, billboardGeometry } from '../src/impostors/Impostor'
    import { KTX2Loader } from '../src/loaders/KTX2Loader'
    import { SKY_OCCLUSION_WGSL } from '../src/shadows/SkyOcclusion'
    import { CASCADED_SHADOWS_WGSL, GBUFFER_OUT_WGSL, MOTION_VECTORS_WGSL } from '../src/materials/shaders/SharedWGSL'
    import { CLIPMAP_PROBES_WGSL, VOXEL_WRITE_WGSL } from '../src/gi/GiWGSL'
    import { VoxelGIEffect } from '../src/gi/VoxelGIEffect'
    import { SkyAtmosphere } from '../src/atmosphere/SkyAtmosphere'
    import { directionFromElevationBearing } from '../src/atmosphere/AtmosphereParams'
    import { SKY_LIGHTING_WGSL } from '../src/atmosphere/AtmosphereWGSL'
    import { FroxelGrid } from '../src/froxels/FroxelGrid'
    import { PostProcessingVolume } from '../src/postprocessing/PostProcessingVolume'
    import { AtmosphereEffect } from '../src/postprocessing/effects/AtmosphereEffect'
    import { ScreenSpaceGIEffect } from '../src/postprocessing/effects/ScreenSpaceGIEffect'
    import { VolumetricFogEffect } from '../src/postprocessing/effects/VolumetricFogEffect'
    import { TemporalAAEffect } from '../src/postprocessing/effects/TemporalAAEffect'
    import { ToneMapEffect, ToneMapper, exposureFromEV100, toneMapOptionsForSurface, LENS_ATTENUATION_UE4 } from '../src/postprocessing/effects/ToneMapEffect'
    import { RtPlacement } from '../src/rt/RtGrid'
    import { RtReflectionsEffect } from '../src/rt/RtReflectionsEffect'
    import { RtDiffuseGiEffect, RT_GI_DENOISERS, RT_GI_HIT_LIGHTINGS, RT_GI_KERNELS, RT_GI_MODES, RT_GI_RESOLUTIONS, RT_GI_SHADOWS, RT_GI_VIEWS } from '../src/rt/RtDiffuseGiEffect'
    import { FrameTimer } from '../src/pacing/FrameTimer'
    import { AbBench } from '../src/profiling/AbBench'
    import { installProfileHud } from './profile-hud.js'
    import { mipChain } from './forest/canvas.js'
    import * as treeTextures from './forest/tree_textures.js'
    import * as treeMeshes from './forest/tree_meshes.js'
    import * as cover from './forest/cover.js'

    // ── the Raggare intro's data, from raggare.kansei.graphics (CORS open) ────────────────────
    const base = (() => {
      const b = param('data') ?? 'https://raggare.kansei.graphics/';
      return b.endsWith('/') ? b : `${b}/`;
    })();
    // The road's scanned surfaces (textures/road/<name>_{color,nra}.ktx2), in road.wgsl's order.
    const ROAD_SURFACES = ['base', 'var', 'patch', 'edge'];
    // The materials' WGSL, shared with the Rust example.
    const wgsl = (name) => fetch(new URL(`./forest/${name}.wgsl`, import.meta.url)).then((r) => r.text());
    const [WGSL, data] = await Promise.all([
      Promise.all(['ambient', 'forest', 'terrain', 'road', 'water', 'tree', 'tree_impostor', 'cover'].map(wgsl))
        .then(([ambient, forest, terrain, road, water, tree, treeImpostor, coverWgsl]) => ({ ambient, forest, terrain, road, water, tree, treeImpostor, cover: coverWgsl })),
      (async () => {
        const json = await fetchBytes(`${base}data/scene.json`);
        const scene = JSON.parse(new TextDecoder().decode(json));
        const files = [scene.terrain.file, scene.terrain.splat.file, scene.road.file, ...['trees', 'grass', 'flowers', 'bushes'].map((k) => scene.instances[k].file)].map((f) => `${base}data/${f}`);
        files.push(`${base}textures/ground/color.ktx2`, `${base}textures/ground/nra.ktx2`);
        for (const s of ROAD_SURFACES) files.push(`${base}textures/road/${s}_color.ktx2`, `${base}textures/road/${s}_nra.ktx2`);
        const bytes = await Promise.all(files.map((f) => fetchBytes(f)));
        const floats = (b) => new Float32Array(b.buffer, b.byteOffset, b.byteLength / 4);
        const [height, splat, road, trees, grass, flowers, bushes, groundColor, groundNra, ...roadTextures] = bytes;
        const t = scene.terrain;
        const raw = new Uint16Array(height.buffer, height.byteOffset, height.byteLength / 2);
        const heights = Float32Array.from(raw, (v) => (v - t.height_offset) * t.height_scale);
        return {
          scene, heights, splat, road: floats(road), trees: floats(trees), grass: floats(grass), flowers: floats(flowers), bushes: floats(bushes),
          groundColor, groundNra, roadTextures, bytes: json.byteLength + bytes.reduce((s, b) => s + b.byteLength, 0),
        };
      })(),
    ]);
    const dataMiB = data.bytes / (1 << 20);
    console.log(`Outdoor GI: ${(data.bytes / 1e6).toFixed(1)} MB of the Raggare intro's data from ${base}`);

    // The heights as a grid: (x, z) in metres to the rendered terrain's height.
    const terrainMeta = data.scene.terrain;
    const [NX, NZ] = terrainMeta.samples;
    const heightAt = (ix, iz) => data.heights[Math.min(iz, NZ - 1) * NX + Math.min(ix, NX - 1)];
    // The terrain mesh: every 2nd heightmap sample (2 m), as the film's, in tiles of 63 x 63 quads.
    const TERRAIN_STEP = 2;
    const TILE_QUADS = 63;
    // The height of the terrain mesh drawn every `step` samples at (x, z), as its triangles split.
    function meshHeight(x, z, step) {
      const cell = terrainMeta.spacing * step;
      const fx = Math.max((x - terrainMeta.origin[0]) / cell, 0);
      const fz = Math.max((z - terrainMeta.origin[1]) / cell, 0);
      const cols = Math.floor((NX - 1) / step), rows = Math.floor((NZ - 1) / step);
      const c = Math.min(Math.floor(fx), cols - 1), r = Math.min(Math.floor(fz), rows - 1);
      const tx = Math.min(Math.max(fx - c, 0), 1), tz = Math.min(Math.max(fz - r, 0), 1);
      const h = (cc, rr) => heightAt(cc * step, rr * step);
      const [h00, h10, h01, h11] = [h(c, r), h(c + 1, r), h(c, r + 1), h(c + 1, r + 1)];
      return tx + tz <= 1 ? h00 + (h10 - h00) * tx + (h01 - h00) * tz : h11 + (h01 - h11) * (1 - tx) + (h10 - h11) * (1 - tz);
    }
    function terrainNormal(ix, iz, reach) {
      const x0 = Math.max(ix - reach, 0), x1 = Math.min(ix + reach, NX - 1);
      const z0 = Math.max(iz - reach, 0), z1 = Math.min(iz + reach, NZ - 1);
      const dx = (heightAt(x1, iz) - heightAt(x0, iz)) / ((x1 - x0) * terrainMeta.spacing);
      const dz = (heightAt(ix, z1) - heightAt(ix, z0)) / ((z1 - z0) * terrainMeta.spacing);
      const l = Math.hypot(dx, 1, dz);
      return [-dx / l, 1 / l, -dz / l];
    }

    // ── constants, as forest.rs's ───────────────────────────────────────────────────────────
    // The layer the trees are on besides the default one: the canopy the sky occlusion sees.
    const TREE_LAYER = 1 << 1;
    const ROAD_LIFT = 0.06;
    const LAKE_MARGIN_M = 20;
    // The ground scans' calibration: the mean albedo each is scaled to, its tile size (m), and the
    // served file's own mean (measured once from ground/color.ktx2's full-size level).
    const GROUND_SURFACES = [
      [[0.060, 0.075, 0.040], 1.6, [0.12575, 0.16025, 0.03476]],
      [[0.040, 0.036, 0.026], 2.0, [0.09792, 0.05576, 0.03901]],
      [[0.045, 0.060, 0.022], 2.2, [0.32821, 0.30291, 0.10932]],
      [[0.160, 0.150, 0.130], 1.8, [0.30594, 0.25340, 0.12932]],
      [[0.095, 0.075, 0.052], 2.0, [0.20074, 0.14436, 0.08645]],
      [[0.260, 0.235, 0.180], 2.5, [0.33282, 0.25815, 0.15878]],
    ];
    const GROUND_ALBEDO = [0.05, 0.05, 0.034];
    const ROAD_ALBEDO = [0.07, 0.066, 0.062];
    const WATER_ALBEDO = [0.02, 0.026, 0.03];
    const NEEDLES = [0.035, 0.065, 0.032];
    const LEAVES = [0.05, 0.09, 0.026];
    const SPRUCE_BARK = [0.1, 0.075, 0.06];
    const BIRCH_BARK = [0.5, 0.49, 0.45];
    const LOD_THRESHOLDS = [0.22, 0.06];
    const IMPOSTOR_THRESHOLD = 0.03;
    const CARD_IMPOSTOR_THRESHOLD = 0.1;
    const LOD_FADE = 0.12;
    const CARD_STRETCH = 1.15;
    const NOWHERE = [Number.MAX_VALUE, Number.MAX_VALUE];
    const IMPOSTOR_FRAME = 64;
    const GI_BANDS = [[0, 20], [20, 60], [60, Infinity]];
    const ROADSIDE_M = 9;
    // Where a tree's record puts a point of its mesh, as tree.wgsl's vertex_main does, for the
    // ray tracing grid.
    const TREE_PLACEMENT_WGSL = /* wgsl */`
      fn tree_hash12(p: vec2f) -> f32 {
          var p3 = fract(vec3f(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
      }

      fn kansei_rt_place(record: u32, p: vec3f) -> vec3f {
          let place = kansei_rt_record_vec4(record, 0u);
          let extra = kansei_rt_record_vec4(record, 4u);
          let w = place.w * (0.9 + 0.2 * tree_hash12(place.xz));
          let q = p * vec3f(w, place.w, w);
          let c = cos(-extra.x);
          let s = sin(-extra.x);
          return vec3f(c * q.x + s * q.z, q.y, -s * q.x + c * q.z) + place.xyz;
      }
    `;

    // EV100 for a sun `elevation` degrees up (index_sky's curve), opened up for the forest's shade.
    const autoEv100 = (elevation) => {
      const curve = [[-8, 5], [-4, 7.3], [-2.5, 8.2], [0, 9.8], [2, 11.2], [6, 12.8], [15, 14.3], [40, 15]];
      if (elevation <= curve[0][0]) return curve[0][1];
      for (let i = 1; i < curve.length; i++) {
        const [e0, v0] = curve[i - 1], [e1, v1] = curve[i];
        if (elevation <= e1) return v0 + (v1 - v0) * (elevation - e0) / (e1 - e0);
      }
      return curve[curve.length - 1][1];
    };
    const forestEv100 = (elevation) => autoEv100(elevation) - 2.3;
    const num = (name) => {
      const v = param(name);
      const n = v === null ? NaN : parseFloat(v);
      return Number.isFinite(n) ? n : null;
    };
    // A 0..1 hash of a position for CPU-side choices, forest.rs's `hash_xz` (integer mixing of the
    // position in centimetres, exact in both).
    function hashXZ(x, z) {
      let h = (Math.imul(Math.round(x * 100) | 0, 0x9e3779b1) ^ Math.imul(Math.round(z * 100) | 0, 0x85ebca77)) >>> 0;
      h = (h ^ (h >>> 15)) >>> 0;
      h = Math.imul(h, 0x2c1b3c6d) >>> 0;
      h = (h ^ (h >>> 12)) >>> 0;
      return (h >>> 8) / (1 << 24);
    }

    // ── the renderer: cascades, the voxel clipmap with its probes, the sky occlusion ───────────
    const canvas = Canvas.fill();
    const renderer = await canvas.renderer({ sampleCount: 1, clearColor: new Vector4(0, 0, 0, 1) });
    const device = renderer.gpuDevice;
    renderer.enableCascadedShadows({ maxDistance: paramOr('shadow_far', 160), casterDistance: 120, resolution: paramOr('shadow_res', 1024) });
    const gi = renderer.enableVoxelClipmap({
      levels: paramOr('levels', 5),
      resolution: paramOr('res', 64),
      heightResolution: paramOr('res', 64) / 2,
      voxelSize: paramOr('vox', 0.5),
    });
    // the film's sky occlusion, for comparison: the trees seen from above
    const skyOcclusion = renderer.enableSkyOcclusion({ extentM: 320, minHeightM: -10, maxHeightM: 90, volumeSize: [128, 32], layerMask: TREE_LAYER });
    // reflect=1: ray-traced reflections on the wet road and lake (wet=all: everywhere), through a
    // grid of the scene's triangles round the camera, 64 x 32 x 64 m (rt=1: the grid alone); gi=rt:
    // the hybrid GI's rays through it
    const GI_MODES = ['off', 'skyocc', 'visibility', 'cones', 'probes', 'ssgi', 'rt'];
    const giMode = GI_MODES.includes(param('gi')) ? param('gi') : 'rt';
    const reflect = flag('reflect', false);
    const rt = flag('rt', false) || reflect || giMode === 'rt';
    const wet = !reflect ? [0, 0, 0]
      : param('wet') === 'all' ? [paramOr('wet_f0', 0.04), paramOr('wet_f0', 0.04), paramOr('wet_rough', 0.1)]
      : [paramOr('wet_f0', 0.04), 0, paramOr('wet_rough', 0.1)];
    if (rt) {
      const cell = paramOr('rt_cell', 0.5);
      const across = Math.round(64 / cell / 4) * 4;
      renderer.enableRtGrid({ grid: { dims: [across, across / 2, across], cell, below: 0.25 }, clusterErrorCells: 1, rebuildEveryFrame: flag('rt_rebuild', false) });
    }
    // the spruces' card clusters prune at an error of 16 render pixels (card_error=<px>; the far
    // crowns are the impostors'), four times that in the shadow maps, as the film's
    renderer.setClusterErrorThreshold(paramOr('card_error', 16));
    renderer.setShadowClusterErrorScale(4);

    const sky = new SkyAtmosphere(device);
    sky.sun.illuminance = [100000, 100000, 100000];
    gi.useSkyLighting(sky.bindings.skyLighting);
    gi.settings.levelsPerFrame = paramOr('lit', gi.settings.levelsPerFrame);
    if (['off', 'fallback', 'always'].includes(param('coneshadows'))) gi.settings.coneShadows = param('coneshadows');
    gi.settings.bounce = paramOr('bounce', gi.settings.bounce);
    gi.settings.coneShadowSteps = paramOr('shadowsteps', gi.settings.coneShadowSteps);
    const probes = gi.enableProbes({ probesPerFrame: paramOr('probes', 8192) });
    const ambientMode = device.createBuffer({ label: 'AmbientMode', size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    // What every material's sky light reads (ambient.wgsl): the sky, the GI mode, the sky occlusion
    // and the clipmap's probes, group 0 bindings 1-7.
    const fragment = GPUShaderStage.FRAGMENT;
    const ambientBindings = [
      { binding: 1, visibility: fragment, value: ComputeBuffer.fromExternal(sky.bindings.skyLighting, BufferBase.BUFFER_TYPE_UNIFORM) },
      { binding: 2, visibility: fragment, value: ComputeBuffer.fromExternal(ambientMode, BufferBase.BUFFER_TYPE_UNIFORM) },
      { binding: 3, visibility: fragment, value: Texture.fromView('SkyOcclusion', skyOcclusion.volumeTexture, skyOcclusion.volume), layout: BindingLayouts.texture3d() },
      { binding: 4, visibility: fragment, value: new Sampler('linear', 'linear', 'clamp-to-edge') },
      { binding: 5, visibility: fragment, value: ComputeBuffer.fromExternal(skyOcclusion.params, BufferBase.BUFFER_TYPE_UNIFORM) },
      { binding: 6, visibility: fragment, value: ComputeBuffer.fromExternal(probes.gridBuffer, BufferBase.BUFFER_TYPE_UNIFORM) },
      { binding: 7, visibility: fragment, value: ComputeBuffer.fromExternal(probes.probeBuffer, BufferBase.BUFFER_TYPE_READ_ONLY_STORAGE), layout: BindingLayouts.storage(true) },
    ];
    const PRELUDE = [SKY_LIGHTING_WGSL, SKY_OCCLUSION_WGSL, CLIPMAP_PROBES_WGSL, WGSL.ambient, CASCADED_SHADOWS_WGSL, GBUFFER_OUT_WGSL, VOXEL_WRITE_WGSL, MOTION_VECTORS_WGSL, LOD_FADE_WGSL, WGSL.forest].join('\n');
    const uniform = (values) => new ComputeBuffer({
      type: BufferBase.BUFFER_TYPE_UNIFORM,
      usage: BufferBase.BUFFER_USAGE_UNIFORM | BufferBase.BUFFER_USAGE_COPY_DST,
      buffer: values instanceof Float32Array ? values : new Float32Array(values),
    });
    // A forest material: `body` after the prelude, its uniform at binding 0, the ambient's at 1-7
    // and `extra` bindings after them.
    const forestMaterial = (label, body, values, extra, options = {}) => new Material(`${PRELUDE}\n${body}`, {
      label,
      mrtOutputCount: 4,
      ...options,
      bindings: [{ binding: 0, visibility: GPUShaderStage.VERTEX | fragment, value: uniform(values) }, ...ambientBindings, ...extra],
    });
    const repeatSampler = new Sampler('linear', 'linear', 'repeat', 16);
    const clampSampler = new Sampler('linear', 'linear', 'clamp-to-edge');
    const ktx2 = async (label, bytes, options) => {
      const t = await KTX2Loader.transcode(label, bytes, options, renderer.compressionSupport);
      console.log(t.summary());
      return t.toTexture();
    };
    // a painted RGBA8 image with its mip chain (the alpha test's coverage kept down the chain)
    const painted = (label, w, h, rgba, srgb, alphaTest) => Texture.fromLevels(label, srgb ? 'rgba8unorm-srgb' : 'rgba8unorm', w, h, mipChain(w, h, rgba, alphaTest).map(([, , d]) => d));
    const textured = (pair, sampler = repeatSampler) => [
      { binding: 8, visibility: fragment, value: pair[0] },
      { binding: 9, visibility: fragment, value: pair[1] },
      { binding: 10, visibility: fragment, value: sampler },
    ];
    const meshGeometry = (label, mesh) => Geometry.fromArrays(label, new Float32Array(mesh.v), new Uint32Array(mesh.indices));

    // ── the scene ─────────────────────────────────────────────────────────────────────────────
    const scene = new Scene();
    // every renderable, for hide=
    const renderables = [];
    const add = (r) => { renderables.push(r); scene.add(r); return r; };
    let triangles = 0;
    // the terrain, in tiles, textured by the exported splat weights
    const splatMeta = terrainMeta.splat;
    const splat = Texture.fromRGBA('Splat', splatMeta.samples[0], splatMeta.samples[1], data.splat);
    const [groundColor, groundNra] = await Promise.all([ktx2('Ground/colour', data.groundColor, KTX2Loader.color()), ktx2('Ground/nra', data.groundNra, KTX2Loader.linear())]);
    const layers = GROUND_SURFACES.flatMap(([target, tile, mean]) => [target[0] / mean[0], target[1] / mean[1], target[2] / mean[2], tile]);
    const [cols, rows] = [Math.floor((NX - 1) / TERRAIN_STEP), Math.floor((NZ - 1) / TERRAIN_STEP)];
    for (let r0 = 0; r0 < rows; r0 += TILE_QUADS) {
      for (let c0 = 0; c0 < cols; c0 += TILE_QUADS) {
        const [tc, tr] = [Math.min(TILE_QUADS, cols - c0), Math.min(TILE_QUADS, rows - r0)];
        const v = new Float32Array((tc + 1) * (tr + 1) * 9);
        let k = 0;
        for (let r = r0; r <= r0 + tr; r++) {
          for (let c = c0; c <= c0 + tc; c++) {
            const [ix, iz] = [c * TERRAIN_STEP, r * TERRAIN_STEP];
            const x = terrainMeta.origin[0] + ix * terrainMeta.spacing;
            const z = terrainMeta.origin[1] + iz * terrainMeta.spacing;
            const n = terrainNormal(ix, iz, TERRAIN_STEP);
            v.set([x, heightAt(ix, iz), z, 1, ...n, ((x - terrainMeta.origin[0]) / splatMeta.spacing + 0.5) / splatMeta.samples[0], ((z - terrainMeta.origin[1]) / splatMeta.spacing + 0.5) / splatMeta.samples[1]], 9 * k++);
          }
        }
        const w = tc + 1;
        const idx = new Uint32Array(tc * tr * 6);
        k = 0;
        for (let r = 0; r < tr; r++) {
          for (let c = 0; c < tc; c++) {
            const i00 = r * w + c, i10 = i00 + 1, i01 = i00 + w;
            idx.set([i00, i01, i10, i10, i01, i01 + 1], 6 * k++);
          }
        }
        triangles += idx.length / 3;
        const m = forestMaterial('Terrain', WGSL.terrain, layers, [
          { binding: 8, visibility: fragment, value: splat },
          { binding: 9, visibility: fragment, value: clampSampler },
          { binding: 10, visibility: fragment, value: groundColor, layout: BindingLayouts.texture2dArray() },
          { binding: 11, visibility: fragment, value: groundNra, layout: BindingLayouts.texture2dArray() },
          { binding: 12, visibility: fragment, value: repeatSampler },
        ], { voxelFragmentEntry: 'voxel_main' });
        const t = new Renderable(Geometry.fromArrays('Terrain', v, idx), m);
        t.gi = { albedo: GROUND_ALBEDO };
        // the hits shaded with the height field's vertex normals, not its facets
        t.rt = rt ? { albedo: GROUND_ALBEDO, smoothNormals: true } : null;
        add(t);
      }
    }

    // the road, with the scanned asphalts
    {
      const spec = data.scene.road.spec;
      const stride = data.scene.road.stride;
      const halfWidth = spec.width * 0.5 + spec.shoulder;
      const n = data.road.length / stride;
      const centre = (i) => [data.road[i * stride + 1], data.road[i * stride + 2] + ROAD_LIFT, data.road[i * stride + 3]];
      const v = new Float32Array(n * 2 * 9);
      for (let i = 0; i < n; i++) {
        const s = data.road[i * stride];
        const c = centre(i);
        const tl = Math.hypot(data.road[i * stride + 4], data.road[i * stride + 5]);
        const t = [data.road[i * stride + 4] / tl, 0, data.road[i * stride + 5] / tl];
        const right = [-t[2], 0, t[0]]; // t x Y
        // the normal tilts with the grade (the ribbon is level across)
        const a = centre(Math.min(i + 1, n - 1)), b = centre(Math.max(i - 1, 0));
        const along = [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        let nrm = [right[1] * along[2] - right[2] * along[1], right[2] * along[0] - right[0] * along[2], right[0] * along[1] - right[1] * along[0]];
        const nl = Math.hypot(...nrm);
        nrm = nl > 0 && nrm[1] > 0 ? nrm.map((x) => x / nl) : [0, 1, 0];
        v.set([c[0] - right[0] * halfWidth, c[1], c[2] - right[2] * halfWidth, 1, ...nrm, -1, s], 18 * i);
        v.set([c[0] + right[0] * halfWidth, c[1], c[2] + right[2] * halfWidth, 1, ...nrm, 1, s], 18 * i + 9);
      }
      const idx = new Uint32Array((n - 1) * 6);
      for (let i = 0; i < n - 1; i++) idx.set([2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 2, 2 * i + 1, 2 * i + 3], 6 * i);
      triangles += idx.length / 3;
      const params = [spec.width * 0.5, spec.width * 0.5 - 0.3, 0.75, halfWidth, 0.7, 2, 0.35, 1.7, wet[0], wet[2], 0, 0];
      const textures = await Promise.all(ROAD_SURFACES.flatMap((s, i) => [
        ktx2(`Road/${s}/colour`, data.roadTextures[2 * i], KTX2Loader.color()),
        ktx2(`Road/${s}/nra`, data.roadTextures[2 * i + 1], KTX2Loader.linear()),
      ]));
      const m = forestMaterial('Road', WGSL.road, params, [
        ...textures.map((value, i) => ({ binding: 8 + i, visibility: fragment, value })),
        { binding: 16, visibility: fragment, value: repeatSampler },
      ], { voxelFragmentEntry: 'voxel_main' });
      const road = new Renderable(Geometry.fromArrays('Road', v, idx), m);
      road.gi = { albedo: ROAD_ALBEDO };
      road.rt = rt ? { albedo: ROAD_ALBEDO } : null;
      add(road);
    }

    // the lake: a quad over its outline at its level, the terrain hiding it on land
    {
      const lake = terrainMeta.lake;
      const xs = lake.outline.map((p) => p[0]), zs = lake.outline.map((p) => p[1]);
      const [x0, x1, z0, z1] = [Math.min(...xs) - LAKE_MARGIN_M, Math.max(...xs) + LAKE_MARGIN_M, Math.min(...zs) - LAKE_MARGIN_M, Math.max(...zs) + LAKE_MARGIN_M];
      const y = lake.level;
      const v = new Float32Array([x0, y, z0, 1, 0, 1, 0, x0, z0, x1, y, z0, 1, 0, 1, 0, x1, z0, x0, y, z1, 1, 0, 1, 0, x0, z1, x1, y, z1, 1, 0, 1, 0, x1, z1]);
      const m = forestMaterial('Lake', WGSL.water, [...WATER_ALBEDO, 1, 0.02, wet[0] > 0 ? 0.02 : 0.05, wet[0] > 0 ? 1 : 0, 0], [], { voxelFragmentEntry: 'voxel_main' });
      const water = new Renderable(Geometry.fromArrays('Lake', v, new Uint32Array([0, 2, 1, 1, 2, 3])), m);
      water.castShadow = false;
      water.gi = { albedo: WATER_ALBEDO };
      water.rt = rt ? { albedo: WATER_ALBEDO } : null;
      add(water);
    }

    // the forest: spruces along the road keep low, full crowns; inside it a random mix of slim and
    // full crowns; the birches among them
    const tex = treeTextures.generate();
    const A = treeTextures.ATLAS, [BW, BH] = [treeTextures.BARK_W, treeTextures.BARK_H];
    const pair = (label, w, h, [c, n], alpha) => [painted(label, w, h, c, true, alpha), painted(`${label}/Normal`, w, h, n, false)];
    const atlases = {
      foliage: pair('Trees/Foliage', A, A, tex.foliage, 0.5),
      spruceBark: pair('Trees/SpruceBark', BW, BH, tex.spruceBark),
      birchBark: pair('Trees/BirchBark', BW, BH, tex.birchBark),
      cover: pair('Cover', cover.ATLAS, cover.ATLAS, cover.atlas(), 0.5),
    };
    const roadStride = data.scene.road.stride;
    const roadCells = new Map();
    for (let i = 0; i < data.road.length; i += roadStride) {
      const key = `${Math.floor(data.road[i + 1] / 20)},${Math.floor(data.road[i + 3] / 20)}`;
      if (!roadCells.has(key)) roadCells.set(key, []);
      roadCells.get(key).push([data.road[i + 1], data.road[i + 3]]);
    }
    const nearRoad = (x, z, radius) => {
      const [cx, cz] = [Math.floor(x / 20), Math.floor(z / 20)];
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
        for (const [px, pz] of roadCells.get(`${cx + dx},${cz + dz}`) ?? []) if ((px - x) ** 2 + (pz - z) ** 2 < radius * radius) return true;
      }
      return false;
    };
    const groups = [[], [], [], []];
    for (let i = 0; i < data.trees.length; i += 8) {
      const [x, z] = [data.trees[i], data.trees[i + 2]];
      const g = data.trees[i + 5] > 0.5 ? 3 : nearRoad(x, z, ROADSIDE_M) ? treeMeshes.SPRUCE_EDGE_STYLE : Math.floor(hashXZ(x, z) * 2) % 2;
      groups[g].push(i);
    }
    const instanceAttributes = [
      { shaderLocation: 3, offset: 0, format: 'float32x4' },
      { shaderLocation: 4, offset: 16, format: 'float32x4' },
    ];
    const recordBuffer = (records) => new ComputeBuffer({
      type: BufferBase.BUFFER_TYPE_STORAGE,
      usage: BufferBase.BUFFER_USAGE_VERTEX | BufferBase.BUFFER_USAGE_STORAGE,
      buffer: records,
      stride: 32,
      attributes: instanceAttributes,
    });
    // as culled: the fade after the record
    const culled = (source) => source.withVertexLayout(36, [...instanceAttributes, { shaderLocation: 5, offset: 32, format: 'float32' }]);

    // One species: three LODs, each a bark and a foliage renderable sharing the instances, the
    // spruces' foliage also as card clusters, and an impostor; their bands set each frame.
    function treeLayer(g, indices) {
      const spruce = g < 3;
      const label = spruce ? `Spruce${g}` : 'Birch';
      const records = new Float32Array(indices.length * 8);
      indices.forEach((i, k) => records.set(data.trees.subarray(i, i + 8), 8 * k));
      const count = indices.length;
      const source = recordBuffer(records);
      const heights = indices.map((i) => data.trees[i + 3]).sort((a, b) => a - b);
      const height = heights[Math.floor(heights.length / 2)];
      const meshes = [0, 1, 2].map((lod) => spruce ? treeMeshes.spruce(lod, treeMeshes.SPRUCE_STYLES[g]) : treeMeshes.birch(lod, 9));
      const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
      for (const m of [meshes[0].bark, meshes[0].foliage]) {
        for (let i = 0; i < m.v.length; i += 9) for (let c = 0; c < 3; c++) {
          lo[c] = Math.min(lo[c], m.v[i + c]);
          hi[c] = Math.max(hi[c], m.v[i + c]);
        }
      }
      const reach = Math.max(-lo[0], hi[0], -lo[2], hi[2]) * 1.1;
      const culling = () => new InstanceCulling(source, count, 32, 0, 1.05)
        .withRadiusScale(12)
        .withBoundsShift([0, (lo[1] + hi[1]) * 0.5, 0])
        .withBoundsBox([reach, (hi[1] - lo[1]) * 0.5, reach])
        .withCrossfade(1);
      const [barkAlbedo, foliageAlbedo, barkTex] = spruce ? [SPRUCE_BARK, NEEDLES, atlases.spruceBark] : [BIRCH_BARK, LEAVES, atlases.birchBark];
      const renderable = (name, geometry, foliage) => {
        const m = forestMaterial(name, WGSL.tree, [1, 1, 1, 1, foliage ? 1 : 0, spruce ? 0 : 1, 0, 0], textured(foliage ? atlases.foliage : barkTex), {
          cullMode: foliage ? 'none' : 'back',
          shadowFragmentEntry: 'shadow_fragment',
          voxelFragmentEntry: 'voxel_main',
        });
        const r = new Renderable(new InstancedGeometry(geometry, count, [culled(source)]), m);
        r.gi = { albedo: foliage ? foliageAlbedo : barkAlbedo };
        r.instanceCulling = culling();
        // in the scene, and the canopy the sky occlusion is built from
        r.layers |= TREE_LAYER;
        return r;
      };
      const tris = [0, 0, 0];
      const nodes = meshes.map(({ bark, foliage }, lod) => {
        tris[lod] = bark.triangles() + foliage.triangles();
        const b = renderable(`${label}/Bark/LOD${lod}`, meshGeometry(`${label}/Bark/LOD${lod}`, bark), false);
        const f = renderable(`${label}/Foliage/LOD${lod}`, meshGeometry(`${label}/Foliage/LOD${lod}`, foliage), true);
        // the ray tracing grid: LOD0's bark, and the birches' leaves (the spruces' needles are
        // their cards'), the foliage cut out by the atlas' alpha (layer 0)
        if (rt && lod === 0) {
          b.rt = { albedo: barkAlbedo };
          b.rtPlacement = RtPlacement.wgsl(TREE_PLACEMENT_WGSL);
          if (!spruce) {
            f.rt = { albedo: foliageAlbedo, alphaLayer: 0 };
            f.rtPlacement = RtPlacement.wgsl(TREE_PLACEMENT_WGSL);
          }
        }
        add(b);
        add(f);
        return [b, f];
      });
      // the spruces' foliage as card clusters: one renderable over every instance, each tree's cut
      // picked per cluster and per view
      let cards = null;
      if (spruce) {
        const name = `${label}/Foliage/Cards`;
        const geometry = meshGeometry(name, meshes[0].foliage);
        cards = renderable(name, geometry, true);
        cards.clusters = new ClusterLod(ClusterMesh.build(geometry, { cards: true, cardErrorScale: 0.25 }))
          .withTransform({ kind: 'placement', position: 0, scale: 12, yaw: 16, yawScale: -1 })
          .withStretch(CARD_STRETCH);
        if (rt) {
          cards.rt = { albedo: foliageAlbedo, alphaLayer: 0 };
          cards.rtPlacement = RtPlacement.wgsl(TREE_PLACEMENT_WGSL);
        }
        add(cards);
      }
      triangles += Math.max(...tris) * count;
      return { count, height, nodes, cards, impostor: null, source, lo, hi, culling };
    }
    const treeLayers = groups.map((indices, g) => indices.length ? treeLayer(g, indices) : null).filter((l) => l);
    const treeCount = treeLayers.reduce((s, l) => s + l.count, 0);

    // Each layer's LOD0 baked into an octahedral impostor, added as the far LOD: a billboard per
    // tree on the same instances, baked at the layer's median height.
    for (const layer of treeLayers) {
      const [bark, foliage] = layer.nodes[0];
      // the instance it is baked from: at the origin, unturned, the median height; tree.wgsl's
      // hash of the origin is 0, so its width factor is 0.9 and its tint 0.85
      const [width, tint, h] = [0.9, 0.85, layer.height];
      const s = [width * h, h, width * h];
      const impostor = renderer.bakeImpostor([bark, foliage], {
        frameSize: IMPOSTOR_FRAME,
        bounds: [layer.lo.map((v, i) => v * s[i]), layer.hi.map((v, i) => v * s[i])],
        instance: new Float32Array([0, 0, 0, h, 0, 0, 0, 0, 1]),
      });
      // the bake's height, width and tint, then the impostor's parameters (one uniform: the
      // fragment stage has room for no more)
      const values = new Float32Array(4 + impostor.params().length);
      values.set([h, width, tint, 0]);
      values.set(impostor.params(), 4);
      const m = forestMaterial('TreeImpostor', `${IMPOSTOR_WGSL}\n${WGSL.treeImpostor}`, values, textured([impostor.albedoTexture(), impostor.normalDepthTexture()], clampSampler), {
        cullMode: 'none',
        shadowFragmentEntry: 'shadow_fragment',
      });
      const r = new Renderable(new InstancedGeometry(billboardGeometry('TreeImpostor'), layer.count, [culled(layer.source)]), m);
      // never in the GI's voxels nor the grid: the coarsest LOD stands for the far trees there
      r.instanceCulling = layer.culling().withGiLodRange(0, 0);
      r.castShadow = flag('impostor_shadows', true);
      r.layers |= TREE_LAYER;
      add(r);
      layer.impostor = r;
    }
    await device.queue.onSubmittedWorkDone();

    // The film's LOD bands for this frame's lens (forest.rs `TreeLayer::update`): a tree of the
    // layer's median height changes LOD where its height on screen crosses LOD_THRESHOLDS and
    // becomes the impostor below IMPOSTOR_THRESHOLD (the spruces' cards reach
    // CARD_IMPOSTOR_THRESHOLD), `camera` times nearer; the shadow maps `shadow` times nearer. The
    // GI's voxels take fixed bands (GI_BANDS), the ray tracing grid LOD0 and the cards.
    function updateLayer(layer, tanHalfVfov, camera, shadow) {
      const d = LOD_THRESHOLDS.map((t) => layer.height / (2 * t * camera * tanHalfVfov));
      const far = layer.impostor ? layer.height / (2 * IMPOSTOR_THRESHOLD * camera * tanHalfVfov) : Infinity;
      let view = [[0, d[0]], [d[0], d[1]], [d[1], far]];
      const sd = [d[0] * camera / shadow, d[1] * camera / shadow, far * camera / shadow];
      let shadowed = [[0, sd[0]], [sd[0], sd[1]], [sd[1], sd[2]]];
      const crossfade = 2 * LOD_FADE * d[0];
      const hand = layer.cards && layer.impostor ? Math.min(layer.height / (2 * CARD_IMPOSTOR_THRESHOLD * camera * tanHalfVfov), far) : null;
      const clip = (band, at) => band[0] >= at ? NOWHERE : [band[0], Math.min(band[1], at)];
      if (hand !== null) view = view.map((b) => clip(b, hand));
      const shadowHand = hand !== null ? hand * camera / shadow : null;
      if (shadowHand !== null) shadowed = shadowed.map((b) => clip(b, shadowHand));
      const set = (r, band, sh, gib) => {
        const c = r.instanceCulling;
        c.crossfade = crossfade;
        c.lodRange = band;
        c.shadowLodRange = sh;
        c.giLodRange = gib;
        c.rtLodRange = [0, Infinity];
      };
      layer.nodes.forEach(([bark, foliage], lod) => {
        set(bark, view[lod], shadowed[lod], GI_BANDS[lod]);
        // with the cards, no view draws the spruces' foliage LODs 0 and 1 (nor 2 below an impostor)
        const carded = layer.cards && (lod < 2 || hand !== null);
        set(foliage, carded ? NOWHERE : view[lod], carded ? NOWHERE : shadowed[lod], layer.cards && lod === 0 ? NOWHERE : GI_BANDS[lod]);
      });
      if (layer.cards) set(layer.cards, [0, hand ?? d[1]], [0, shadowHand ?? sd[1]], GI_BANDS[0]);
      if (layer.impostor) set(layer.impostor, [hand ?? far, Infinity], [shadowHand ?? sd[2], Infinity], NOWHERE);
    }

    // the ground cover: verge grass, flowers and shrubs from the scatter, near the camera,
    // standing on the rendered ground
    const coverMeshes = cover.meshes();
    for (const [label, records, meshes, regions, near, far, radius] of [
      ['Grass', data.grass, coverMeshes.grass, [cover.GRASS, cover.SEEDS], 25, 160, 0.8],
      ['Flowers', data.flowers, coverMeshes.flowers, [cover.FLOWERS, cover.FLOWERS], 20, 120, 0.6],
      ['Shrubs', data.bushes, coverMeshes.shrub, [cover.SHRUB, cover.SHRUB], 60, 220, 1.0],
    ]) {
      const instances = Float32Array.from(records);
      const count = instances.length / 8;
      if (!count) continue;
      for (let i = 0; i < instances.length; i += 8) instances[i + 1] = meshHeight(instances[i], instances[i + 2], TERRAIN_STEP);
      const source = recordBuffer(instances);
      const bands = [[0, near], [near, far]];
      meshes.forEach((mesh, lod) => {
        const m = forestMaterial(label, WGSL.cover, [...regions[0].r, ...regions[1].r], textured(atlases.cover), { cullMode: 'none', shadowFragmentEntry: 'shadow_fragment' });
        triangles += mesh.triangles() * count / 4;
        const r = new Renderable(new InstancedGeometry(meshGeometry(`${label}/LOD${lod}`, mesh), count, [culled(source)]), m);
        // out of the GI's voxels and the ray tracing grid: too small for either
        r.instanceCulling = new InstanceCulling(source, count, 32, 0, radius)
          .withRadiusScale(12)
          .withLodRange(bands[lod][0], bands[lod][1])
          .withGiLodRange(0, 0)
          .withCrossfade(2 * LOD_FADE * near);
        r.castShadow = label === 'Shrubs';
        add(r);
      });
    }

    const sun = new DirectionalLight([0, -1, 0], [0, 0, 0], 1);
    sun.castShadow = true;
    scene.add(sun);
    // hide=<labels>: leave parts out, to measure them (`setHidden`)
    const setHidden = (labels) => {
      const hidden = (labels ?? '').split(',').filter((h) => h);
      for (const r of renderables) r.visible = !hidden.some((h) => r.geometry.label.includes(h));
    };
    setHidden(param('hide'));

    // ── the chain: the GI first (it lies on the surfaces under the aerial perspective), the
    // reflections, the atmosphere, the fog, TAA, the display transform ──────────────────────────
    const config = {
      gi: giMode,
      view: ['lit', 'indirect', 'voxels'].includes(param('view')) ? param('view') : 'lit',
      elevation: num('elevation') ?? 14,
      bearing: num('bearing') ?? 110,
      cam: 'trunks',
    };
    const ev = () => num('ev') ?? forestEv100(config.elevation);
    const tonemapOptions = () => ({
      ...toneMapOptionsForSurface(renderer.presentationFormat),
      exposure: exposureFromEV100(ev(), LENS_ATTENUATION_UE4),
      exposureCompensation: 1,
      tonemapper: ToneMapper.AcesFitted,
    });
    const tonemap = new ToneMapEffect(tonemapOptions());
    const giEffect = VoxelGIEffect.withClipmap(gi.clipmap, { intensity: paramOr('intensity', 1) });
    giEffect.setSkyLighting(sky.bindings.skyLighting);
    // screen-space GI (gi=ssgi): the bounces between what is on screen, the sky taken out where it
    // is hidden
    const ssgi = new ScreenSpaceGIEffect({ radiusM: paramOr('ssgi_radius', 6) });
    ssgi.setSkyLighting(sky.bindings.skyLighting);
    const effects = [giEffect, ssgi];
    // The hybrid's settings (gi=rt): the URL's rtgi_* parameters and setRtgi's keys. An 8 m near
    // field: half the trace of the whole 64 m box, for some light lost under the canopy past it,
    // which the clipmap's voxels are too coarse to hold.
    const RTGI_KEYS = {
      res: RT_GI_RESOLUTIONS, denoise: RT_GI_DENOISERS, kernel: RT_GI_KERNELS, hit: RT_GI_HIT_LIGHTINGS,
      shadows: RT_GI_SHADOWS, mode: RT_GI_MODES, accum: null, view: RT_GI_VIEWS, near: null,
    };
    const rtgi = { res: 'half', denoise: 'svgf', kernel: '3x3', hit: 'direct', shadows: 'rays', mode: 'hybrid', accum: false, view: 'lit', near: 8 };
    // one setting by its key and name; false if either is unknown
    const setRtgiKey = (key, value) => {
      if (!(key in RTGI_KEYS)) return false;
      if (key === 'accum') {
        rtgi.accum = value === true || value === '1' || value === 'true';
        return true;
      }
      if (key === 'near') {
        const near = parseFloat(value);
        if (!Number.isFinite(near)) return false;
        rtgi.near = Math.max(near, 0);
        return true;
      }
      if (!RTGI_KEYS[key].includes(value)) return false;
      rtgi[key] = value;
      return true;
    };
    for (const key of Object.keys(RTGI_KEYS)) {
      if (param(`rtgi_${key}`) !== null) setRtgiKey(key, param(`rtgi_${key}`));
    }
    // the foliage atlas' alpha, for the alpha tests through the grid
    const foliageAlpha = () => {
      const t = atlases.foliage[0];
      if (!t.initialized) t.initialize(device);
      return t.resource;
    };
    // with the grid, the hybrid (on in gi=rt): rays through the grid, the foliage alpha-tested, the
    // hits lit by the sun (shadow rays, the cascades past the grid) and the clipmap, the clipmap
    // and the sky past the grid
    let hybrid = null;
    if (rt) {
      hybrid = RtDiffuseGiEffect.withClipmap(gi.clipmap, renderer.rtGrid.handle, {});
      hybrid.setSkyLighting(sky.bindings.skyLighting);
      hybrid.setAlphaTexture(foliageAlpha());
      hybrid.setCascadedShadowMap(renderer.cascadedShadowMap);
      hybrid.heatScale = 0.5 / exposureFromEV100(ev(), LENS_ATTENUATION_UE4);
      hybrid.collectStats = flag('stats', false);
      effects.push(hybrid);
    }
    let reflections = null;
    if (reflect) {
      reflections = RtReflectionsEffect.withClipmap(gi.clipmap, renderer.rtGrid.handle, {
        resolution: param('rt_res') === 'quarter' ? 'quarter' : 'half',
        alphaTest: flag('rt_alpha', true),
      });
      reflections.setSkyLighting(sky.bindings.skyLighting);
      reflections.setAlphaTexture(foliageAlpha());
      reflections.view = ['lit', 'reflection', 'mirror', 'cost'].includes(param('rt_view')) ? param('rt_view') : 'lit';
      reflections.heatScale = 0.5 / exposureFromEV100(ev(), LENS_ATTENUATION_UE4);
      reflections.collectStats = flag('stats', false);
      reflections.traceGrid = param('rt_trace') !== 'voxels';
      effects.push(reflections);
    }
    effects.push(new AtmosphereEffect(sky));
    // fog=<density>: mist in the forest, lit by the sun through the cascades and by the sky, or by
    // the clipmap's probes in its modes
    let fog = null;
    const fogDensity = num('fog') ?? 0.0015;
    if (fogDensity > 0) {
      fog = new VolumetricFogEffect({
        froxelGrid: new FroxelGrid(device, { near: 0.5, far: 240, temporal: true, blendFactor: 0.1 }),
        cascadedShadowMap: renderer.cascadedShadowMap,
        baseDensity: fogDensity,
        heightFalloff: 0.06,
        anisotropy: 0.55,
        albedo: [0.85, 0.88, 0.93],
      });
      fog.setSkyLighting(sky.bindings.skyLighting);
      effects.push(fog);
    }
    if (flag('taa', true)) effects.push(new TemporalAAEffect({ exposure: tonemap.totalExposure() }));
    effects.push(tonemap);
    const volume = new PostProcessingVolume(renderer, effects);
    // the voxels' debug view: the GI effect's view of them and the display transform alone
    const voxelsEffect = VoxelGIEffect.withClipmap(gi.clipmap);
    voxelsEffect.showVoxels = true;
    const debugTonemap = new ToneMapEffect(tonemapOptions());
    const debugVolume = new PostProcessingVolume(renderer, [voxelsEffect, debugTonemap]);

    // ── the cameras: the film's shots as starting views, the shots in turn, or a drive ──────────
    const FREE_FOV = 55;
    const camera = new Camera(FREE_FOV, 0.2, 4000, canvas.aspect);
    const controls = new CameraControls(camera, new Vector3(0, 0, 0), renderer.canvas, 10).withMousePan();
    const SHOTS = { canopy: 'Shot01_Canopy', trunks: 'Shot02_Trunks', branches: 'Shot03_Branches', lake: 'Shot04_Lake', headlights: 'Shot05_Headlights', departure: 'Shot06_Departure', rise: 'Shot07_Rise' };
    const shots = data.scene.film.shots;
    const filmback = data.scene.film.filmback_mm;
    // Where a shot's camera is `local` seconds into it: position, direction and horizontal field of
    // view (radians), its keys interpolated linearly as the film does.
    function shotPose(shot, local) {
      const keys = shot.camera;
      let k = keys[0];
      if (keys.length > 1) {
        let i = keys.findIndex((key) => key[0] > local);
        i = Math.min(Math.max(i < 0 ? keys.length - 1 : i, 1), keys.length - 1);
        const [a, b] = [keys[i - 1], keys[i]];
        const u = Math.min(Math.max((local - a[0]) / Math.max(b[0] - a[0], 1e-6), 0), 1);
        k = a.map((v, c) => v + (b[c] - v) * u);
      }
      const [sb, cb, sp, cp] = [Math.sin(k[4]), Math.cos(k[4]), Math.sin(k[5]), Math.cos(k[5])];
      return { eye: [k[1], k[2], k[3]], dir: [sb * cp, sp, -cb * cp], hfov: 2 * Math.atan(filmback[0] * 0.5 / shot.lens_mm) };
    }
    // the vertical field of view (degrees) for the shot's lens at the canvas's aspect
    const verticalFov = (hfov) => 2 * Math.atan(Math.tan(hfov * 0.5) / Math.max(camera.aspect, 1)) * 180 / Math.PI;
    let mode = 'orbit';
    let clock = 0;
    function resetHistory() {
      camera.resetMotion();
      giEffect.resetHistory();
      voxelsEffect.resetHistory();
      hybrid?.resetHistory();
    }
    function setCamera(name) {
      clock = 0;
      mode = name === 'film' ? 'film' : name === 'drive' || name === 'fly' ? 'drive' : 'orbit';
      camera.fov = FREE_FOV;
      if (mode === 'orbit') {
        const shot = shots.find((s) => s.id === (SHOTS[name] ?? SHOTS.trunks));
        // the shot's camera halfway through it, as an orbit 8 m round what it looks at
        const { eye, dir, hfov } = shotPose(shot, shot.duration * 0.5);
        camera.fov = verticalFov(hfov);
        const r = 8;
        controls.setView(new Vector3(eye[0] + dir[0] * r, eye[1] + dir[1] * r, eye[2] + dir[2] * r), r, Math.atan2(-dir[0], -dir[2]), Math.asin(-dir[1]));
      }
      camera.updateProjectionMatrix();
      resetHistory();
      config.cam = mode === 'orbit' ? (name in SHOTS ? name : 'trunks') : name === 'fly' ? 'drive' : name;
    }

    // Bring the clipmap, the materials' ambient and the chain to the GI mode and the view.
    function apply() {
      // the clipmap runs for its GI and its probes (and the hybrid's far field); the effects show
      // the GI on screen
      const clipmap = ['visibility', 'cones', 'probes', 'rt'].includes(config.gi);
      const onScreen = config.gi === 'cones' || config.gi === 'probes';
      gi.settings.enabled = clipmap;
      device.queue.writeBuffer(ambientMode, 0, new Uint32Array([{ skyocc: 1, visibility: 2 }[config.gi] ?? 0, 0, 0, 0]));
      if (fog) {
        fog.setClipmapProbes(clipmap ? probes : null);
        fog.setSkyOcclusion(config.gi === 'skyocc' ? skyOcclusion : null);
      }
      giEffect.enabled = onScreen;
      giEffect.setClipmapProbes(config.gi === 'probes' ? probes : null);
      giEffect.showIndirect = config.view === 'indirect';
      giEffect.resetHistory();
      ssgi.enabled = config.gi === 'ssgi';
      ssgi.showIndirect = config.view === 'indirect';
      // the hybrid brought to its settings (its history restarts)
      if (hybrid) {
        hybrid.enabled = config.gi === 'rt';
        hybrid.setResolution(rtgi.res);
        hybrid.denoise = rtgi.denoise;
        hybrid.kernel = rtgi.kernel;
        hybrid.hitLighting = rtgi.hit;
        hybrid.shadows = rtgi.shadows;
        hybrid.mode = rtgi.mode;
        hybrid.accumulate = rtgi.accum;
        hybrid.nearDistance = rtgi.near;
        hybrid.view = config.view === 'indirect' ? 'indirect' : rtgi.view;
        hybrid.resetHistory();
      }
      for (const key of ['gi', 'view', 'cam', 'elevation']) document.getElementById(key).value = config[key];
      for (const key of Object.keys(RTGI_KEYS)) {
        const el = document.getElementById(`rtgi-${key}`);
        if (key === 'accum') el.checked = rtgi.accum;
        else el.value = rtgi[key];
      }
      // the hybrid's settings, shown while it runs
      document.getElementById('rtgi-panel').style.display = config.gi === 'rt' && hybrid ? '' : 'none';
    }
    function setElevation(degrees) {
      config.elevation = degrees;
      for (const t of [tonemap, debugTonemap]) t.options.exposure = exposureFromEV100(ev(), LENS_ATTENUATION_UE4);
    }

    // ── stats and scripted captures ───────────────────────────────────────────────────────────
    const stats = flag('stats', false) ? { since: performance.now(), frames: 0, frameMs: 0, gpuMs: 0, gpuSpanMs: 0, passes: [] } : null;
    if (stats) {
      renderer.setProfiling(true);
      document.getElementById('stats').style.display = 'block';
    }
    const sum = (prefix) => (stats?.passes ?? []).filter(([label]) => label.startsWith(prefix)).reduce((s, [, ms]) => s + ms, 0);
    const rtInfo = () => {
      const grid = renderer.rtGrid;
      if (!grid) return null;
      const s = grid.stats;
      return { triangles: s.grid.triangles, references: s.grid.references, big: s.grid.bigTriangles, sources: s.sources, rebuilt: s.rebuilt, rebuilds: s.rebuilds, cpuMs: +s.cpuMs.toFixed(3), mib: +(grid.memoryBytes() / (1 << 20)).toFixed(1) };
    };
    // the hybrid's settings and, with its effect, its counters, memory and accumulated frames
    const rtgiInfo = () => {
      if (!hybrid) return null;
      const s = hybrid.stats;
      return {
        ...rtgi, on: hybrid.enabled, accumulated: hybrid.accumulated, mib: +(hybrid.memoryBytes() / (1 << 20)).toFixed(1),
        rays: s?.rays ?? 0, hits: s?.hits ?? 0, cost: s?.cost ?? 0, shadowRays: s?.shadowRays ?? 0,
      };
    };
    const info = () => {
      const layout = gi.clipmap.layout;
      const eye = camera.position;
      return {
        gi: config.gi, view: config.view, camera: config.cam, levels: layout.levels, dims: [...layout.dims], voxel: layout.voxelSize,
        mib: +(gi.memoryBytes() / (1 << 20)).toFixed(1), filling: gi.filling, trees: treeCount, triangles, dataMiB: +dataMiB.toFixed(1),
        elevation: config.elevation, bearing: config.bearing,
        eye: [eye.x, eye.y, eye.z].map((v) => +v.toFixed(1)), stats: !!stats,
        frameMs: +(stats?.frameMs ?? 0).toFixed(2), gpuMs: +(stats?.gpuMs ?? 0).toFixed(3), gpuSpanMs: +(stats?.gpuSpanMs ?? 0).toFixed(3),
        voxelizeMs: +(sum('VoxelClipmap/Voxelize') + sum('VoxelClipmap/Dynamic')).toFixed(3),
        injectMs: +sum('VoxelClipmap/Inject').toFixed(3), probesMs: +sum('VoxelClipmap/Probes').toFixed(3), screenMs: +sum('VoxelGI/Screen').toFixed(3),
        ssgiMs: +sum('SSGI').toFixed(3),
        rtgi: rtgiInfo(), rtgiMs: +sum('RtGi/').toFixed(3),
        rt: rtInfo(), rtMs: +(sum('Rt/Gather') + sum('Rt/Grid')).toFixed(3), reflectMs: +(sum('Rt/Trace') + sum('Rt/Resolve')).toFixed(3),
        passes: (stats?.passes ?? []).map(([label, ms]) => [label, +ms.toFixed(3)]),
      };
    };
    const set = (key) => (value) => { config[key] = value; apply(); };
    // rt only where the page built the grid (gi=rt, the default, rt=1 or reflect=1)
    const setGi = (name) => { if (GI_MODES.includes(name) && (name !== 'rt' || hybrid)) set('gi')(name); };
    const setRtgi = (key, value) => { if (setRtgiKey(key, value)) apply(); };
    window.kansei = {
      info, setGi, setRtgi, setView: set('view'), setCamera, setElevation, setHidden,
      setBearing: (degrees) => { config.bearing = degrees; },
      setStats: (on) => renderer.setProfiling(on),
      setReflections: (on) => { if (reflections) { reflections.enabled = on; reflections.resetHistory(); } },
      setReflectionView: (name) => { if (reflections) reflections.view = name; },
      renderer, scene, camera, gi,
    };
    // the hybrid traces the grid of triangles, built at load (gi=rt, rt=1 or reflect=1): without
    // it, choosing the hybrid reloads the page with gi=rt
    document.getElementById('gi').onchange = (e) => {
      if (e.target.value === 'rt' && !hybrid) {
        const params = new URLSearchParams(location.search);
        params.set('gi', 'rt');
        location.search = params.toString();
        return;
      }
      setGi(e.target.value);
    };
    document.getElementById('view').onchange = (e) => set('view')(e.target.value);
    for (const key of Object.keys(RTGI_KEYS)) {
      const el = document.getElementById(`rtgi-${key}`);
      el.onchange = () => setRtgi(key, key === 'accum' ? el.checked : el.value);
    }
    document.getElementById('cam').onchange = (e) => { setCamera(e.target.value); apply(); };
    document.getElementById('elevation').oninput = (e) => setElevation(parseFloat(e.target.value));
    if (!flag('ui', true)) document.getElementById('panel').style.display = 'none';
    document.getElementById('loading').remove();

    setCamera(param('cam') ?? 'drive');
    apply();
    const hud = installProfileHud({ renderer, FrameTimer, AbBench });
    console.log(`Kansei — Outdoor GI (TS) ready: ${JSON.stringify(info())}`);

    const lodScale = paramOr('lod', 1.5);
    const shadowLod = paramOr('shadow_lod', 2);
    let time = 0;
    run(canvas, (frame) => {
      frame.resize(renderer, camera);
      const dt = Math.min(Math.max(frame.dt, 0), 0.1);
      time += dt;
      clock += dt;
      if (mode === 'film') {
        const length = Math.max(...shots.map((s) => s.start + s.duration), 1);
        const t = clock % length;
        let index = 0;
        shots.forEach((s, i) => { if (t >= s.start) index = i; });
        const shot = shots[index];
        const { eye, dir, hfov } = shotPose(shot, t - shot.start);
        const fov = verticalFov(hfov);
        if (Math.abs(fov - camera.fov) > 1e-3) {
          // a cut: the GI's history is of another place
          camera.fov = fov;
          camera.updateProjectionMatrix();
          resetHistory();
        }
        camera.position.set(eye[0], eye[1], eye[2]);
        camera.lookAt(new Vector3(eye[0] + dir[0], eye[1] + dir[1], eye[2] + dir[2]));
      } else if (mode === 'drive') {
        // along the road, eyes 1.4 m up, looking 25 m ahead
        const n = data.road.length / roadStride;
        const i = Math.floor(clock * 12) % n;
        const j = Math.min(i + 25, n - 1);
        const r = (k, c) => data.road[k * roadStride + c];
        camera.position.set(r(i, 1), r(i, 2) + 1.4, r(i, 3));
        camera.lookAt(new Vector3(r(j, 1), r(j, 2) + 1.2, r(j, 3)));
      } else {
        controls.update(dt);
      }
      const tanHalf = Math.tan(camera.fov * Math.PI / 360);
      for (const layer of treeLayers) updateLayer(layer, tanHalf, lodScale, lodScale * shadowLod);
      const sunDir = directionFromElevationBearing(config.elevation, config.bearing);
      sky.sun.direction = sunDir;
      const eye = [camera.position.x, camera.position.y, camera.position.z];
      sun.direction = [-sunDir[0], -sunDir[1], -sunDir[2]];
      sun.color = sky.sunIlluminanceAt(eye);
      sun.intensity = 1;
      if (fog) {
        fog.updateLights(scene.directionalLights, scene.pointLights);
        fog.time = time;
      }
      hybrid?.updateLights(scene.directionalLights, scene.pointLights, scene.areaLights);
      sky.update(camera);
      hud.begin(performance.now());
      (config.view === 'voxels' && gi.settings.enabled ? debugVolume : volume).render(scene, camera);
      hud.end(performance.now());
      if (stats) {
        stats.frames++;
        const now = performance.now();
        if (now - stats.since >= 1000) {
          stats.frameMs = (now - stats.since) / stats.frames;
          stats.frames = 0;
          stats.since = now;
          const profile = renderer.takeProfile();
          if (profile.gpuFrames > 0) {
            stats.passes = profile.topPasses(Infinity);
            stats.gpuMs = profile.gpuMs;
            stats.gpuSpanMs = profile.gpuSpanMs;
          }
          const i = info();
          setText('stats', [
            `GI ${i.gi} / ${i.view}, clipmap ${i.levels} x [${i.dims}] of ${i.voxel} m, ${i.mib} MiB${i.filling ? ', filling' : ''}`,
            `${treeCount} trees, ${(triangles / 1e6).toFixed(1)} M triangles at LOD0`,
            `frame ${i.frameMs} ms, GPU ${i.gpuMs} ms of passes (span ${i.gpuSpanMs})`,
            `voxelize ${i.voxelizeMs}  inject ${i.injectMs}  probes ${i.probesMs}  screen ${i.screenMs}  ssgi ${i.ssgiMs} ms`,
            ...(i.rtgi?.on ? [`hybrid GI: ${i.rtgiMs} ms, ${i.rtgi.mib} MiB, near field ${i.rtgi.near ? i.rtgi.near + ' m' : 'the box'}; ${i.rtgi.rays} rays, ${i.rtgi.rays ? (100 * i.rtgi.hits / i.rtgi.rays).toFixed(0) : 0}% hit, ${i.rtgi.rays ? (i.rtgi.cost / i.rtgi.rays).toFixed(1) : 0} cells + triangles a ray` + (i.rtgi.accum ? `, ${i.rtgi.accumulated} frames accumulated` : '')] : []),
            ...stats.passes.slice(0, 12).map(([label, ms]) => `${label.padEnd(32)} ${ms.toFixed(3)}`),
          ].join('\n'));
        }
      }
    });
  </script>
</body>

</html>
