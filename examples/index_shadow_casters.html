<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kansei - shadow casters</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #status {
      position: fixed; left: 12px; top: 12px; color: #ddd; font: 12px/1.4 monospace;
      background: rgba(0, 0, 0, 0.6); padding: 6px 8px; white-space: pre;
    }
  </style>
</head>

<body>
  <div id="status">Shadows are drawn through each material's own vertex_main:
four instanced cubes cast four shadows, and the checker card's
shadowFragmentEntry cuts its holes out of its shadow.</div>
  <script type="module">
    import { Canvas, run } from '../src/web/index'
    import { Camera } from '../src/cameras/Camera'
    import { CameraControls } from '../src/controls/CameraControls'
    import { Scene } from '../src/objects/Scene'
    import { Renderable } from '../src/objects/Renderable'
    import { Material } from '../src/materials/Material'
    import { ComputeBuffer } from '../src/buffers/ComputeBuffer'
    import { BufferBase } from '../src/buffers/BufferBase'
    import { BoxGeometry } from '../src/geometries/BoxGeometry'
    import { PlaneGeometry } from '../src/geometries/PlaneGeometry'
    import { InstancedGeometry } from '../src/geometries/InstancedGeometry'
    import { DirectionalLight } from '../src/lights/DirectionalLight'
    import { Vector3 } from '../src/math/Vector3'
    import { Vector4 } from '../src/math/Vector4'

    const canvas = Canvas.fill().withMaxPixelRatio(1);
    const renderer = await canvas.renderer({ sampleCount: 4 });

    const scene = new Scene();
    const camera = new Camera(40, 0.1, 60, window.innerWidth / window.innerHeight);
    const controls = new CameraControls(camera, new Vector3(0, 0, 1), renderer.canvas, 22);

    // The renderer renders the shadow map from the first directional light that casts shadows.
    const dirLight = new DirectionalLight([0.3, -1.0, 0.6], [1, 1, 1], 1.0);
    dirLight.castShadow = true;
    scene.add(dirLight);
    renderer.enableShadows({ resolution: 2048, maxShadowDistance: 40 });

    // One shader for every surface; `vertex_main` differs only in where an instance sits.
    const shader = (vertexMain) => /* wgsl */`
      #include <shadows>

      @group(0) @binding(0) var<uniform> baseColor : vec4f;
      @group(1) @binding(0) var<uniform> viewMatrix : mat4x4f;
      @group(1) @binding(1) var<uniform> projectionMatrix : mat4x4f;
      @group(2) @binding(0) var<uniform> normalMatrix : mat4x4f;
      @group(2) @binding(1) var<uniform> worldMatrix : mat4x4f;

      const LIGHT_DIR = vec3f(${dirLight.direction.join(', ')});

      struct VertexOut {
        @builtin(position) position : vec4f,
        @location(0) worldPos : vec3f,
        @location(1) normal : vec3f,
        @location(2) uv : vec2f,
      }

      fn place(position : vec4f, normal : vec3f, uv : vec2f, offset : vec3f) -> VertexOut {
        let worldPos = worldMatrix * position + vec4f(offset, 0.0);
        var out : VertexOut;
        out.position = projectionMatrix * viewMatrix * worldPos;
        out.worldPos = worldPos.xyz;
        out.normal = normalize((normalMatrix * vec4f(normal, 0.0)).xyz);
        out.uv = uv;
        return out;
      }

      ${vertexMain}

      // The card's holes: a 4x4 checker.
      fn cutout(uv : vec2f) {
        let cell = vec2i(floor(uv * 4.0));
        if (baseColor.w > 0.5 && (cell.x + cell.y) % 2 == 0) { discard; }
      }

      @fragment
      fn fragment_main(in : VertexOut) -> @location(0) vec4f {
        cutout(in.uv);
        let N = in.normal;
        var facing = dot(N, -normalize(LIGHT_DIR));
        if (baseColor.w > 0.5) { facing = abs(facing); } // the card is lit from both sides
        let lit = max(facing, 0.0) * kansei_shadow_map(in.worldPos, N);
        return vec4f(baseColor.rgb * (0.2 + 0.8 * lit), 1.0);
      }

      // The shadow pass's fragment entry: no colour targets and no group 3, only the cut.
      @fragment
      fn shadow_fragment(in : VertexOut) {
        cutout(in.uv);
      }
    `;
    const plainVertex = /* wgsl */`
      @vertex
      fn vertex_main(@location(0) position : vec4f, @location(1) normal : vec3f, @location(2) uv : vec2f) -> VertexOut {
        return place(position, normal, uv, vec3f(0.0));
      }
    `;
    const instancedVertex = /* wgsl */`
      @vertex
      fn vertex_main(@location(0) position : vec4f, @location(1) normal : vec3f, @location(2) uv : vec2f,
                     @location(3) offset : vec4f) -> VertexOut {
        return place(position, normal, uv, offset.xyz);
      }
    `;
    const material = (code, color, options = {}) => new Material(code, {
      bindings: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, value: color }],
      ...options,
    });

    // Ground.
    const ground = new Renderable(new PlaneGeometry(30, 30),
      material(shader(plainVertex), new Vector4(0.8, 0.8, 0.8, 0), { cullMode: 'none' }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Four cubes from one instanced draw, none of them at the renderable's origin.
    const offsets = new Float32Array([-7, 1, -3, 1, -3.5, 1, -3, 1, 3.5, 1, -3, 1, 7, 1, -3, 1]);
    const instanceOffsets = new ComputeBuffer({
      usage: BufferBase.BUFFER_USAGE_STORAGE | BufferBase.BUFFER_USAGE_VERTEX,
      type: ComputeBuffer.BUFFER_TYPE_STORAGE,
      buffer: offsets,
      shaderLocation: 3,
      offset: 0,
      stride: 4 * 4,
      format: 'float32x4',
    });
    const cubes = new Renderable(new InstancedGeometry(new BoxGeometry(2, 2, 2), 4, [instanceOffsets]),
      material(shader(instancedVertex), new Vector4(0.9, 0.45, 0.2, 0)));
    scene.add(cubes);

    // An alpha-tested card: its shadow has the same holes as its surface.
    const card = new Renderable(new PlaneGeometry(5, 5),
      material(shader(plainVertex), new Vector4(0.25, 0.6, 0.9, 1), { cullMode: 'none', shadowFragmentEntry: 'shadow_fragment' }));
    card.position.set(0, 4, 2);
    scene.add(card);

    run(canvas, (f) => {
      f.resize(renderer, camera);
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
