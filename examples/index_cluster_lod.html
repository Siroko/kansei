<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kansei - cluster LOD</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #eee; }
    #panel { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(0, 0, 0, 0.6); border-radius: 4px; }
    #hud, #bench { margin: 0; white-space: pre-wrap; }
  </style>
</head>

<body>
  <div id="panel">
    <pre id="hud"></pre>
    <pre id="bench"></pre>
  </div>
  <script type="module">
    // Cluster LOD: a field of rocks (24 x 24 by default, 81 920 triangles each), drawn three ways
    // with one material: the Rust cluster-lod example's scene. `clusters`: one renderable with
    // cluster LOD (`Renderable.clusters`), each rock's cut picked per cluster every frame on the
    // GPU. `lods`: four discrete LODs cut from the same cluster graph, each at the error budget
    // from its band's near edge, switched per rock by distance (`InstanceCulling`). `full`: the
    // mesh as is. The graph is built here, in TypeScript (`ClusterMesh.build`, which builds Rust's
    // graph word for word from the same mesh), from the Rust example's rock computed in f32 as it
    // is (sin and cos may round a last bit otherwise, so the two graphs are alike, not identical).
    // The HUD shows its build time, the clusters and triangles drawn, the GPU time of each frame
    // and the frame interval.
    //
    // URL parameters: `mode=clusters|lods|full`, `n=<rocks per side>`, `sub=<subdivisions>`,
    // `tau=<pixels>` (the error budget), `size=<w>x<h>`, `t=<seconds>` (the camera's time, frozen),
    // `bench=lods|full` (alternate clusters and that mode every 3 s, 8 times, with the camera still
    // through each pair, and report the mean GPU time and frame interval of each), `dpr=<ratio>`;
    // `profile=1` (each pass's GPU time) through profile-hud.js.
    import { Canvas, run, param, paramOr, setText, thousands } from '../src/web/index'
    import { Camera } from '../src/cameras/Camera'
    import { Scene } from '../src/objects/Scene'
    import { Renderable } from '../src/objects/Renderable'
    import { Material } from '../src/materials/Material'
    import { GBUFFER_OUT_WGSL } from '../src/materials/shaders/SharedWGSL'
    import { ComputeBuffer } from '../src/buffers/ComputeBuffer'
    import { BufferBase } from '../src/buffers/BufferBase'
    import { Geometry } from '../src/buffers/Geometry'
    import { IcosphereGeometry } from '../src/geometries/IcosphereGeometry'
    import { PlaneGeometry } from '../src/geometries/PlaneGeometry'
    import { InstancedGeometry } from '../src/geometries/InstancedGeometry'
    import { Vector3 } from '../src/math/Vector3'
    import { Vector4 } from '../src/math/Vector4'
    import { hash01 } from '../src/math/hash01'
    import { InstanceCulling } from '../src/culling/InstanceCulling'
    import { ClusterMesh } from '../src/clusters/ClusterMesh'
    import { ClusterLod } from '../src/clusters/ClusterLod'
    import { PostProcessingVolume } from '../src/postprocessing/PostProcessingVolume'
    import { ToneMapEffect, exposureFromEV100, toneMapOptionsForSurface } from '../src/postprocessing/effects/ToneMapEffect'
    import { FrameTimer } from '../src/pacing/FrameTimer'
    import { AbBench } from '../src/profiling/AbBench'
    import { installProfileHud } from './profile-hud.js'

    let canvas = Canvas.fill();
    const size = (param('size') ?? '').split('x').map(Number);
    if (size.length === 2 && size.every((n) => n > 0)) canvas = canvas.withSize(size[0], size[1]);
    const renderer = await canvas.renderer({ sampleCount: 1, clearColor: new Vector4(0.45, 0.55, 0.7, 1) });
    const tau = paramOr('tau', 1);
    renderer.setClusterErrorThreshold(tau);
    renderer.setCullingStats(true);

    // Rocks placed by records of position + scale, then yaw (8 floats), lit by a low sun.
    const ROCK_WGSL = /* wgsl */`
      struct Surface { color: vec4<f32> };
      @group(0) @binding(0) var<uniform> surface: Surface;
      @group(1) @binding(0) var<uniform> view_matrix: mat4x4<f32>;
      @group(1) @binding(1) var<uniform> projection_matrix: mat4x4<f32>;
      @group(2) @binding(1) var<uniform> world_matrix: mat4x4<f32>;
      struct VIn { @location(0) position: vec4<f32>, @location(1) normal: vec3<f32>, @location(3) place: vec4<f32>, @location(4) yaw: f32 };
      struct VOut { @builtin(position) @invariant clip: vec4<f32>, @location(0) normal: vec3<f32>, @location(1) world: vec3<f32> };
      fn turn(v: vec3<f32>, a: f32) -> vec3<f32> {
          return vec3<f32>(cos(a) * v.x + sin(a) * v.z, v.y, -sin(a) * v.x + cos(a) * v.z);
      }
      @vertex
      fn vertex_main(v: VIn) -> VOut {
          var out: VOut;
          let world = world_matrix * vec4<f32>(turn(v.position.xyz * v.place.w, v.yaw) + v.place.xyz, 1.0);
          out.clip = projection_matrix * view_matrix * world;
          out.normal = (world_matrix * vec4<f32>(turn(v.normal, v.yaw), 0.0)).xyz;
          out.world = world.xyz;
          return out;
      }
      @fragment
      fn fragment_main(in: VOut) -> KanseiGBufferOut {
          let n = normalize(in.normal);
          let sun = normalize(vec3<f32>(0.4, 0.6, 0.3));
          let light = vec3<f32>(1.0, 0.95, 0.85) * max(dot(n, sun), 0.0) * 3.0 + vec3<f32>(0.25, 0.3, 0.4) * (0.6 + 0.4 * n.y);
          let color = surface.color.rgb * light;
          return kansei_gbuffer_out(color, vec3<f32>(0.0), n, surface.color.rgb);
      }
    `;

    /** Distances (metres) where the discrete LODs start. */
    const BANDS = [0, 8, 24, 72];
    const SPACING = 4;
    const MODES = ['clusters', 'lods', 'full'];

    // glam's Vec3 helpers, in f32 as the Rust example computes them
    const f = Math.fround;
    const fsin = (x) => f(Math.sin(x)), fcos = (x) => f(Math.cos(x));
    const sub3 = (a, b) => [f(a[0] - b[0]), f(a[1] - b[1]), f(a[2] - b[2])];
    const add3 = (a, b) => [f(a[0] + b[0]), f(a[1] + b[1]), f(a[2] + b[2])];
    const scale3 = (a, s) => [f(a[0] * s), f(a[1] * s), f(a[2] * s)];
    const cross3 = (a, b) => [f(f(a[1] * b[2]) - f(a[2] * b[1])), f(f(a[2] * b[0]) - f(a[0] * b[2])), f(f(a[0] * b[1]) - f(a[1] * b[0]))];
    const normalize3 = (a) => scale3(a, f(1 / f(Math.sqrt(f(f(f(a[0] * a[0]) + f(a[1] * a[1])) + f(a[2] * a[2]))))));
    // glam's `any_orthonormal_vector` (Pixar's orthonormal basis)
    const anyOrthonormal = (v) => {
      const sign = v[2] < 0 || Object.is(v[2], -0) ? -1 : 1;
      const a = f(-1 / f(sign + v[2]));
      const b = f(f(v[0] * v[1]) * a);
      return [b, f(sign + f(f(v[1] * v[1]) * a)), -v[1]];
    };

    /** A noisy icosphere of `subdivisions`, about a metre across (the Rust example's `rock`). */
    function rock(subdivisions) {
      const geometry = new IcosphereGeometry(1, subdivisions).withLabel('Rock');
      const v9 = geometry.vertices;
      const height = (v) => f(f(f(1 + f(f(f(0.12) * fsin(f(5 * v[0]))) * fcos(f(4 * v[1])))) + f(f(0.06) * fsin(f(f(13 * v[2]) + f(2 * v[0])))))
        + f(f(f(0.02) * fsin(f(37 * v[1]))) * fcos(f(31 * v[0]))));
      for (let o = 0; o < v9.length; o += 9) {
        const v = [v9[o + 4], v9[o + 5], v9[o + 6]];
        // the normal of the displaced surface, from two nearby points on it
        const a = anyOrthonormal(v), b = cross3(v, anyOrthonormal(v));
        const at = (d) => scale3(normalize3(d), height(normalize3(d)));
        const n = normalize3(cross3(sub3(at(add3(v, scale3(a, f(1e-3)))), at(sub3(v, scale3(a, f(1e-3))))), sub3(at(add3(v, scale3(b, f(1e-3)))), at(sub3(v, scale3(b, f(1e-3)))))));
        const q = scale3(v, height(v));
        const m = normalize3([f(n[0] * f(0.7)), n[1], f(n[2] * f(0.7))]);
        v9.set([q[0], f(q[1] * f(0.7)), q[2], 1, m[0], m[1], m[2]], o);
      }
      return geometry;
    }

    /**
     * The cut of `mesh` seen from `distance` away at `tau` pixels (`ppr` pixels per radian), as a
     * mesh: a discrete LOD for a band starting there (for the largest rock, `scale`).
     */
    function lodMesh(mesh, distance, scale, ppr) {
      return mesh.cutGeometry('Rock/LOD', { eye: [0, 0, distance / scale], pixelsPerRadian: ppr, near: 0.1 / scale, threshold: tau, orthographic: false });
    }

    const uniform = (values) => new ComputeBuffer({
      type: BufferBase.BUFFER_TYPE_UNIFORM,
      usage: BufferBase.BUFFER_USAGE_UNIFORM | BufferBase.BUFFER_USAGE_COPY_DST,
      buffer: new Float32Array(values),
    });
    const material = () => new Material(`${GBUFFER_OUT_WGSL}\n${ROCK_WGSL}`, {
      label: 'Rock',
      bindings: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, value: uniform([0.42, 0.4, 0.37, 1]) }],
      mrtOutputCount: 4,
    });

    // the rocks and their graph
    const n = paramOr('n', 24);
    const subdivisions = paramOr('sub', 6);
    const geometry = rock(subdivisions);
    const triangles = geometry.indices.length / 3;
    const before = performance.now();
    const mesh = ClusterMesh.build(geometry);
    const buildMs = performance.now() - before;

    // the field: position + scale, yaw (8 floats a rock)
    const extent = n * SPACING;
    const rocks = n * n;
    const data = new Float32Array(rocks * 8);
    for (let k = 0; k < rocks; k++) {
      const i = k % n, j = Math.floor(k / n);
      const x = -extent / 2 + (i + 0.2 + 0.6 * hash01(k)) * SPACING;
      const z = -extent / 2 + (j + 0.2 + 0.6 * hash01(k + 7919)) * SPACING;
      data.set([x, 0.2, z, 0.7 + 0.6 * hash01(k + 104729), hash01(k + 3) * 2 * Math.PI, 0, 0, 0], k * 8);
    }
    // one instance buffer for every mode: the geometries' instance vertex buffer and the
    // culling's source (VERTEX and STORAGE)
    const source = new ComputeBuffer({
      type: BufferBase.BUFFER_TYPE_STORAGE,
      usage: BufferBase.BUFFER_USAGE_VERTEX | BufferBase.BUFFER_USAGE_STORAGE,
      buffer: data,
      stride: 32,
      attributes: [
        { shaderLocation: 3, offset: 0, format: 'float32x4' },
        { shaderLocation: 4, offset: 16, format: 'float32' },
      ],
    });
    const culling = (near, far) => new InstanceCulling(source, rocks, 32, 0, 1.2).withRadiusScale(12).withLodRange(near, far);

    const scene = new Scene();
    // the ground: lit by an even sky alone (the rocks' sun is their own)
    const ground = new Renderable(new PlaneGeometry(extent * 2, extent * 2),
      Material.standardLit('Ground', { baseColor: [0.2, 0.22, 0.16], roughness: 0.9, skyUp: [1.6, 1.6, 1.6], skyDown: [1.6, 1.6, 1.6] }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const modes = [[], [], []];
    // clusters
    {
      const r = new Renderable(new InstancedGeometry(geometry, rocks, [source]), material());
      r.instanceCulling = culling(0, Infinity);
      r.clusters = new ClusterLod(mesh).withTransform({ kind: 'placement', position: 0, scale: 12, yaw: 16, yawScale: 1 });
      modes[0].push(r);
    }
    // discrete LODs cut from the graph at the same budget, for the largest rock (1.3), at the
    // starting height (they are not re-cut when the canvas resizes)
    const ppr = canvas.size[1] / (2 * Math.tan((45 * Math.PI / 180) / 2));
    BANDS.forEach((near, k) => {
      const far = BANDS[k + 1] ?? Infinity;
      // cut from a rock's reach nearer than the band's start: within the budget from any side
      const lod = lodMesh(mesh, Math.max(near - 1.6, 0.5), 1.3, ppr);
      const r = new Renderable(new InstancedGeometry(lod, rocks, [source]), material());
      r.instanceCulling = culling(near, far);
      modes[1].push(r);
    });
    // the full mesh
    {
      const r = new Renderable(new InstancedGeometry(geometry, rocks, [source]), material());
      r.instanceCulling = culling(0, Infinity);
      modes[2].push(r);
    }
    for (const r of modes.flat()) scene.add(r);

    const tonemap = new ToneMapEffect({ ...toneMapOptionsForSurface(renderer.presentationFormat), exposure: exposureFromEV100(1) });
    const volume = new PostProcessingVolume(renderer, [tonemap]);
    const camera = new Camera(45, 0.1, 1000, canvas.aspect);

    let mode = Math.max(MODES.indexOf(param('mode')), 0);
    function setMode(m) {
      modes.forEach((list, k) => list.forEach((r) => { r.visible = k === m; }));
      mode = m;
    }
    setMode(mode);
    const benchOther = MODES.indexOf(param('bench'));
    const bench = benchOther > 0 ? new AbBench([MODES[0], MODES[benchOther]], performance.now()) : null;

    /** A loop through the field, low over the rocks, looking ahead and down. */
    function placeCamera(t) {
      const a = t * 0.08;
      const r = extent * 0.35;
      const x = r * Math.cos(a), z = r * Math.sin(a);
      camera.position.set(x, 2.2 + 0.8 * Math.sin(t * 0.3), z);
      camera.lookAt(new Vector3(x - 12 * Math.sin(a), 0, z + 12 * Math.cos(a)));
    }

    const timer = new FrameTimer(renderer.gpuDevice);
    const hud = installProfileHud({ renderer, FrameTimer });
    const levels = mesh.levels().length;
    console.info(`Kansei — Cluster LOD (TS) ready: ${rocks} rocks of ${triangles} triangles, ${mesh.clusters.length} clusters over ${levels} levels built in ${buildMs.toFixed(0)} ms`);

    const frozenT = Number(param('t') ?? NaN);
    let gpuMs = 0, intervalMs = 0;
    run(canvas, (frame) => {
      frame.resize(renderer, camera);
      const now = performance.now();
      const phase = bench?.phase(now);
      if (phase) {
        const m = phase[0] === 0 ? 0 : benchOther;
        if (m !== mode) setMode(m);
      }
      // still through each A/B pair (both modes see the same view), another stretch of the loop
      // for each pair
      const t = bench ? 5 + 9 * bench.pair(now) : Number.isFinite(frozenT) ? frozenT : frame.time;
      placeCamera(t);

      hud.begin(performance.now());
      timer.begin();
      volume.render(scene, camera);
      timer.end();
      hud.end(performance.now());

      intervalMs += (frame.dt * 1000 - intervalMs) * 0.05;
      const gpu = timer.take();
      for (const ms of gpu) gpuMs += (ms - gpuMs) * 0.05;
      const report = bench?.record(gpu, performance.now());
      if (report) {
        console.info(report);
        setText('bench', report);
      }

      if (frame.index % 10 === 0) {
        const stats = renderer.cullingStats?.camera();
        const [w, h] = renderer.renderSize;
        setText('hud', [
          `${MODES[mode]} · ${thousands(rocks)} rocks of ${thousands(triangles)} triangles · graph built in ${buildMs.toFixed(0)} ms · budget ${renderer.clusterErrorThreshold} px`,
          stats ? `camera: ${thousands(stats.drawn)} rocks drawn · ${mode === 0 ? `${thousands(stats.clusters)} clusters · ` : ''}${thousands(stats.triangles)} triangles` : '',
          `${w} x ${h} · GPU ${gpuMs.toFixed(2)} ms${timer.hasTimestamps ? '' : ' (no timestamps)'} · ${intervalMs.toFixed(1)} ms between frames`,
        ].filter(Boolean).join('\n'));
      }
    });
  </script>
</body>

</html>
