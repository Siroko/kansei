<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoF Terrain — Kansei</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <script type="module">
    import { Canvas, run } from '../src/web/index'
    import { Material } from '../src/materials/Material'
    import { BoxGeometry } from '../src/geometries/BoxGeometry'
    import { InstancedGeometry } from '../src/geometries/InstancedGeometry'
    import { Renderable } from '../src/objects/Renderable'
    import { Scene } from '../src/objects/Scene'
    import { Camera } from '../src/cameras/Camera'
    import { Vector2 } from '../src/math/Vector2'
    import { Vector3 } from '../src/math/Vector3'
    import { Float } from '../src/math/Float'
    import { BufferBase } from '../src/buffers/BufferBase'
    import { ComputeBuffer } from '../src/buffers/ComputeBuffer'
    import { CameraControls } from '../src/controls/CameraControls'
    import { PostProcessingVolume } from '../src/postprocessing/PostProcessingVolume'
    import { SSAOEffect } from '../src/postprocessing/effects/SSAOEffect'
    import { DepthOfFieldEffect } from '../src/postprocessing/effects/DepthOfFieldEffect'
    import { CinematicDepthOfFieldEffect, DofDebugView } from '../src/postprocessing/effects/CinematicDepthOfFieldEffect'
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js'

    // Restored from the first post-processing example (examples/index_postpro.html at 82a6164a), before it became
    // the spheres and volumetric fog scene: a scrolling field of noise-driven columns, made to test depth of field.
    //
    // URL parameters (as the Rust depth-of-field example's, where they match):
    //   dof=simple       the simple DoF (a focus range and a blur in pixels) instead of the cinematic one; dof=0 none
    //   focal=<mm>       the lens' focal length on the 23.76 mm filmback (default 450); the view's fov frames the picture
    //   fstop=<N>        f-number (default 1.4)
    //   focus=<units>    focus distance, view depth (default the view's, 101.5)
    //   blades=<n>       aperture blades (default 0: round bokeh)
    //   samples=<n>      gather samples per half-resolution pixel (default 72)
    //   scatter=0        gather the highlights too instead of scattering them as bokeh sprites
    //   lights=1         light the tops of some columns, small bright sources that scatter as bokeh
    //   debug=<1..4>     1 background layer, 2 near layer, 3 near alpha, 4 CoC
    //   t=<seconds>      fix the scroll at this time, for stills
    //   view=<JSON>      the opening view ('Copy view' or the V key)
    const params = new URLSearchParams(window.location.search);
    const numberParam = (name, fallback) => {
      const v = parseFloat(params.get(name) ?? '');
      return Number.isFinite(v) ? v : fallback;
    };
    const DOF_MODE = params.get('dof') === 'simple' ? 'simple' : params.get('dof') === '0' ? 'off' : 'cinematic';
    const LIGHTS = params.has('lights') && params.get('lights') !== '0';
    const FIXED_TIME = params.has('t') ? numberParam('t', 0) : null;

    // ── Scene parameters ──────────────────────────────────────────────────────
    const GRID_SIZE      = 150;   // cubes per side (total = GRID_SIZE²)
    const GRID_SPACING   = 1;   // world-space gap between cube centres
    const NOISE_ZOOM     = 0.07;  // noise frequency — lower = broader hills
    const SCALE_Y_STRENGTH = 60;   // max Y scale applied to each cube
    const SCROLL_SPEED   = 35;   // world-units per second along Z
    const LIGHT_SHARE    = 0.03;  // with lights=1, the share of columns whose top glows
    const LIGHT_RADIANCE = 12.0;  // their tops' brightness (the white columns read about 1)

    const GRID_HALF      = (GRID_SIZE - 1) * GRID_SPACING * 0.5; // centre grid at 0,0
    const GRID_SPAN      = GRID_SIZE * GRID_SPACING;              // total Z extent

    // ── Lambert shader (white base colour, single directional/point light) ───
    // Light sits top-right of the scene: high Y, positive X, slightly back.
    // Light data is baked as WGSL constants. The whole field is one instanced draw: each instance is a column
    // (x, start z, height), and the vertex shader scrolls it along Z by the shared offset, wrapping it to the back.
    const lambertShader = /* wgsl */`
      // World-space light position (top-right of the scene).
      const LIGHT_POS : vec3f = vec3f(80.0, 150.0, -60.0);
      const AMBIENT   : f32   = 0.12;
      const BASE_COLOR: vec3f = vec3f(1.0, 1.0, 1.0);
      const LIGHT_COLOR: vec3f = vec3f(1.0, 0.62, 0.3);
      const MAX_Z     : f32   = ${(GRID_HALF + GRID_SPACING).toFixed(4)};
      const GRID_SPAN : f32   = ${GRID_SPAN.toFixed(4)};

      struct VertexOut {
        @builtin(position) position   : vec4f,
        @location(0)       worldPos   : vec3f,
        @location(1)       worldNormal: vec3f,
        @location(2)       glow       : f32,
      }

      // Scroll along Z in world units, kept in [0, GRID_SPAN).
      @group(0) @binding(0) var<uniform> scrollOffset   : f32;
      @group(2) @binding(0) var<uniform> normalMatrix     : mat4x4f;
      @group(2) @binding(1) var<uniform> worldMatrix      : mat4x4f;
      @group(1) @binding(0) var<uniform> viewMatrix       : mat4x4f;
      @group(1) @binding(1) var<uniform> projectionMatrix : mat4x4f;

      @vertex
      fn vertex_main(
        @location(0) position : vec4f,
        @location(1) normal   : vec3f,
        @location(2) uv       : vec2f,
        @location(3) column   : vec4f, // x, start z, height (y scale), glow of the top face
      ) -> VertexOut {
        // A column that scrolls past the front edge wraps to the back of the grid.
        var z = column.y + scrollOffset;
        if (z > MAX_Z) { z -= GRID_SPAN; }
        let local    = vec4f(position.x + column.x, position.y * column.z, position.z + z, 1.0);
        let worldPos = worldMatrix * local;
        var out : VertexOut;
        out.position    = projectionMatrix * viewMatrix * worldPos;
        out.worldPos    = worldPos.xyz;
        // Inverse-transpose of the column's Y scale (the tall, thin noise columns), then the renderable's normalMatrix.
        let columnNormal = normal * vec3f(1.0, 1.0 / column.z, 1.0);
        out.worldNormal = normalize((normalMatrix * vec4f(columnNormal, 0.0)).xyz);
        out.glow        = select(0.0, column.w, normal.y > 0.5);
        return out;
      }

      // The GBuffer has four colour targets: colour, emissive, normal, albedo.
      struct FragmentOutput {
        @location(0) color    : vec4f,
        @location(1) emissive : vec4f,
        @location(2) normal   : vec4f,
        @location(3) albedo   : vec4f,
      }

      @fragment
      fn fragment_main(frag : VertexOut) -> FragmentOutput {
        let L        = normalize(LIGHT_POS - frag.worldPos);
        let diffuse  = max(dot(frag.worldNormal, L), 0.0);
        let lighting = AMBIENT + (1.0 - AMBIENT) * diffuse;
        let glow     = LIGHT_COLOR * frag.glow;
        return FragmentOutput(
          vec4f(BASE_COLOR * lighting + glow, 1.0),
          vec4f(glow, 1.0),
          vec4f(frag.worldNormal * 0.5 + 0.5, 1.0),
          vec4f(BASE_COLOR, 0.0)
        );
      }
    `;

    // ── Smooth value noise (2-D, 4 octaves) ───────────────────────────────────
    function hash2(xi, yi) {
      const n = Math.sin(xi * 127.1 + yi * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function valueNoise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix,       fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx); // smoothstep
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix,   iy  ), b = hash2(ix+1, iy  );
      const c = hash2(ix,   iy+1), d = hash2(ix+1, iy+1);
      return a + (b-a)*ux + (c-a)*uy + ((d-c)-(b-a))*ux*uy;
    }

    function fbm(x, y, octaves = 4) {
      let v = 0, amp = 0.5, freq = 1, norm = 0;
      for (let i = 0; i < octaves; i++) {
        v    += valueNoise(x * freq, y * freq) * amp;
        norm += amp;
        amp  *= 0.5;
        freq *= 2.0;
      }
      return v / norm; // normalised [0, 1]
    }

    // ── Renderer ──────────────────────────────────────────────────────────────
    const canvas = Canvas.fill().withMaxPixelRatio(1);
    const renderer = await canvas.renderer({
      antialias: true,
      sampleCount: 4
    });

    // ── Camera & controls ─────────────────────────────────────────────────────
    const scene  = new Scene();
    const camera = new Camera(26, 0.1, 1000, window.innerWidth / window.innerHeight);
    // Drag to orbit and scroll to zoom. The opening view is set below (DEFAULT_VIEW).
    const orbitTarget = new Vector3(0, 0, 0);
    const cameraControls = new CameraControls(camera, orbitTarget, null, 100);

    // ── Grid of columns: one instance per column ──────────────────────────────
    // Each column keeps its height from the noise at its starting grid position; only its Z scrolls.
    const columns = new Float32Array(GRID_SIZE * GRID_SIZE * 4);
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const worldX = col * GRID_SPACING - GRID_HALF;
        const worldZ = row * GRID_SPACING - GRID_HALF;
        const i = (row * GRID_SIZE + col) * 4;
        columns[i]     = worldX;
        columns[i + 1] = worldZ;
        columns[i + 2] = fbm(worldX * NOISE_ZOOM, worldZ * NOISE_ZOOM) * SCALE_Y_STRENGTH + 0.1;
        // a fixed scatter of glowing tops (hash2 is deterministic), only with lights=1
        columns[i + 3] = LIGHTS && hash2(col + 0.37, row + 0.71) < LIGHT_SHARE ? LIGHT_RADIANCE : 0;
      }
    }
    const columnBuffer = new ComputeBuffer({
      usage: BufferBase.BUFFER_USAGE_VERTEX | BufferBase.BUFFER_USAGE_COPY_DST,
      buffer: columns,
      shaderLocation: 3,
      offset: 0,
      stride: 4 * 4,
      format: 'float32x4',
    });

    // ── Material (no texture — Lambert only) ──────────────────────────────────
    const scrollOffset = new Float(0);
    const material = new Material(lambertShader, {
      bindings: [{ binding: 0, visibility: GPUShaderStage.VERTEX, value: scrollOffset }],
    });
    const geometry = new InstancedGeometry(new BoxGeometry(1, 1, 1), GRID_SIZE * GRID_SIZE, [columnBuffer]);
    scene.add(new Renderable(geometry, material));

    // ── Post-processing volume ────────────────────────────────────────────────
    const ssaoEffect = new SSAOEffect({
      radius: 0.8,
      bias: 0.02,
      kernelSize: 64,
      strength: 0.5
    });
    // The cinematic DoF's circle of confusion follows from a physical lens (thin-lens equation). A 150-unit terrain
    // seen through a lens that frames it would be nearly all in focus, so the lens is a long one, set apart from the
    // view's field of view: that gives the shallow focus of a miniature.
    const cinematicDof = new CinematicDepthOfFieldEffect({
      lens: {
        focalLengthMm: numberParam('focal', 450),
        fStop: numberParam('fstop', 1.4),
        focusDistanceM: numberParam('focus', 101.5),
        bladeCount: Math.max(0, Math.round(numberParam('blades', 0))),
        bladeRotationDeg: 15,
      },
      sampleCount: Math.max(1, Math.round(numberParam('samples', 72))),
      highlights: { enabled: params.get('scatter') !== '0' },
    });
    cinematicDof.debugView = Math.round(numberParam('debug', DofDebugView.None));
    const simpleDof = new DepthOfFieldEffect({
      focusDistance: 101.5,
      focusRange: 15,
      maxBlur: 24
    });
    const effects = [ssaoEffect];
    if (DOF_MODE === 'cinematic') effects.push(cinematicDof);
    if (DOF_MODE === 'simple') effects.push(simpleDof);
    const volume = new PostProcessingVolume(renderer, effects, { msaaSampleCount: 4 });

    // ── Controls ──────────────────────────────────────────────────────────────
    const pane = new Pane({ title: DOF_MODE === 'simple' ? 'Depth of field (simple)' : 'Depth of field' });
    if (DOF_MODE === 'simple') {
      pane.addBinding(simpleDof, 'focusDistance', { min: 1, max: 150, step: 0.5, label: 'focus distance' });
      pane.addBinding(simpleDof, 'focusRange', { min: 1, max: 80, step: 0.5, label: 'focus range' });
      pane.addBinding(simpleDof, 'maxBlur', { min: 0, max: 32, step: 1, label: 'max blur' });
    } else if (DOF_MODE === 'cinematic') {
      const lens = cinematicDof.lens;
      pane.addBinding(lens, 'focusDistanceM', { min: 1, max: 300, step: 0.5, label: 'focus distance' });
      pane.addBinding(lens, 'fStop', { min: 0.7, max: 22, step: 0.1, label: 'f-stop' });
      pane.addBinding(lens, 'focalLengthMm', { min: 10, max: 600, step: 1, label: 'focal length (mm)' });
      pane.addBinding(lens, 'bladeCount', { min: 0, max: 9, step: 1, label: 'blades' });
      pane.addBinding(lens, 'bladeRotationDeg', { min: 0, max: 90, step: 1, label: 'blade rotation' });
      pane.addBinding(cinematicDof, 'sampleCount', { min: 8, max: 128, step: 1, label: 'samples' });
      pane.addBinding(cinematicDof.highlights, 'enabled', { label: 'scatter highlights' });
      pane.addBinding(cinematicDof, 'debugView', {
        label: 'debug view',
        options: { image: 0, background: 1, near: 2, 'near alpha': 3, CoC: 4 },
      });
    }
    if (window.innerWidth < 768) pane.expanded = false;

    // ── View: the opening camera and DoF, shareable as JSON ──────────────────
    // 'Copy view' (or the V key) copies the current view; open the page with ?view=<that JSON> to restore it exactly.
    // Angles are in degrees: azimuth around the target (0 = +Z side, 90 = +X side), elevation above the ground plane.
    const DEFAULT_VIEW = {
      radius: 150,
      azimuth: 318,
      elevation: 22,
      target: [0, 0, 0],
      fov: 26,
      focusDistance: 101.5,
      focusRange: 15,
      maxBlur: 24,
      fStop: cinematicDof.lens.fStop,
      focalLength: cinematicDof.lens.focalLengthMm,
      blades: cinematicDof.lens.bladeCount,
    };
    // focus=<units> overrides the view's focus distance
    if (params.has('focus')) DEFAULT_VIEW.focusDistance = numberParam('focus', DEFAULT_VIEW.focusDistance);
    const DEG = Math.PI / 180;

    function currentView() {
      // CameraControls keeps its orbit in turns (fractions of a full circle); its fields are TypeScript-private only.
      const cc = cameraControls;
      return {
        radius: +cc.wheelDelta.toFixed(2),
        azimuth: +(cc.currentAngles.x * 360).toFixed(2),
        elevation: +(cc.currentAngles.y * 360).toFixed(2),
        target: [orbitTarget.x, orbitTarget.y, orbitTarget.z].map((v) => +v.toFixed(2)),
        fov: camera.fov,
        focusDistance: DOF_MODE === 'simple' ? simpleDof.focusDistance : cinematicDof.lens.focusDistanceM,
        focusRange: simpleDof.focusRange,
        maxBlur: simpleDof.maxBlur,
        fStop: cinematicDof.lens.fStop,
        focalLength: cinematicDof.lens.focalLengthMm,
        blades: cinematicDof.lens.bladeCount,
      };
    }

    function applyView(view) {
      const v = { ...DEFAULT_VIEW, ...view };
      const cc = cameraControls;
      cc.wheelDelta = cc.wheelDeltaEase = cc.radius = v.radius;
      cc.azimuth = v.azimuth * DEG;
      // Elevation has no setter: set the vertical angle and its eased value together, as the azimuth setter does.
      cc.currentAngles.y = cc.prevAngles.y = v.elevation / 360;
      cc.finalRadians.y = v.elevation * DEG;
      orbitTarget.set(v.target[0], v.target[1], v.target[2]);
      camera.fov = v.fov;
      camera.updateProjectionMatrix();
      simpleDof.focusDistance = v.focusDistance;
      simpleDof.focusRange = v.focusRange;
      simpleDof.maxBlur = v.maxBlur;
      cinematicDof.lens.focusDistanceM = v.focusDistance;
      cinematicDof.lens.fStop = v.fStop;
      cinematicDof.lens.focalLengthMm = v.focalLength;
      cinematicDof.lens.bladeCount = v.blades;
      pane.refresh();
    }

    let openingView = { ...DEFAULT_VIEW };
    const viewParam = params.get('view');
    if (viewParam) {
      try {
        openingView = { ...DEFAULT_VIEW, ...JSON.parse(viewParam) };
      } catch (err) {
        console.warn('Ignoring ?view=, it is not valid JSON:', err);
      }
    }
    applyView(openingView);

    async function copyView() {
      const view = currentView();
      const json = JSON.stringify(view);
      const url = `${location.origin}${location.pathname}?view=${encodeURIComponent(json)}`;
      console.log('Kansei DoF terrain view:\n' + JSON.stringify(view, null, 2) + '\n' + url);
      try {
        await navigator.clipboard.writeText(JSON.stringify({ ...view, url }, null, 2));
        copyButton.title = 'Copied';
      } catch {
        copyButton.title = 'See console';
      }
      setTimeout(() => (copyButton.title = 'Copy view'), 1500);
    }
    const copyButton = pane.addButton({ title: 'Copy view' });
    copyButton.on('click', copyView);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'v' && !e.metaKey && !e.ctrlKey && !e.altKey) copyView();
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    let lastTime = performance.now();

    function animate(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Wrapped on the CPU so the offset keeps full float precision on the GPU.
      scrollOffset.value = FIXED_TIME === null
        ? (scrollOffset.value + SCROLL_SPEED * dt) % GRID_SPAN
        : (SCROLL_SPEED * FIXED_TIME) % GRID_SPAN;

      cameraControls.update();
      volume.render(scene, camera);
    }
    run(canvas, (frame) => {
      frame.resize(renderer, camera);
      animate(performance.now());
    });
  </script>
</body>

</html>
