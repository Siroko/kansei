[workspace]
resolver = "2"
members = [
    "kansei-core",
    "kansei-wasm",
    "kansei-native",
    "kansei-anim-bake",
    "tools/ktx2",
]
exclude = [
    "vendor/basisu",
    "kansei-wasm/examples/hello-scene",
    "kansei-wasm/examples/instancing",
    "kansei-wasm/examples/pathtracer",
    "kansei-wasm/examples/fluid",
    "kansei-wasm/examples/fluid_clock",
    "kansei-wasm/examples/joydivision",
    "kansei-wasm/examples/steering_text",
    "kansei-wasm/examples/volumetric-fog",
    "kansei-wasm/examples/sky-atmosphere",
    "kansei-wasm/examples/film-look",
    "kansei-wasm/examples/spot-lights",
    "kansei-wasm/examples/planar-reflection",
    "kansei-wasm/examples/taa",
    "kansei-wasm/examples/cascaded-shadows",
    "kansei-wasm/examples/depth-of-field",
    "kansei-wasm/examples/gi-box",
    "kansei-wasm/examples/occlusion-culling",
    "kansei-wasm/examples/impostors",
    "kansei-wasm/examples/cluster-lod",
    "kansei-wasm/examples/motion-matching",
    "kansei-wasm/examples/motion-matching-kimodo",
    "kansei-wasm/examples/ktx2-texture",
    "kansei-wasm/examples/voxel-gi-particles",
]

[workspace.dependencies]
wgpu = "24"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
image = "0.25"
gltf = { version = "1", features = ["utils", "extensions", "allow_empty_texture"] }
# vendored with the targets Kansei never requests removed (vendor/basisu/PATCHES.md)
basisu = { path = "vendor/basisu" }
optimesh = "1.1"
