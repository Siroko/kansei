[package]
name = "kansei-anim-bake"
version = "0.1.0"
edition = "2021"
description = "Bakes glTF animation clips into a Kansei motion-matching pack (.kmm)"

[dependencies]
kansei-core = { path = "../kansei-core" }
glam = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
