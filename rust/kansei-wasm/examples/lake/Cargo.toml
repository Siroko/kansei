[package]
name = "kansei-wasm-lake"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The lake page's own `start` (the motion-matching example depends on this crate without it, so
# its own `start` is the only one in its module).
default = ["demo"]
demo = []

[dependencies]
kansei-core = { path = "../../../kansei-core" }
kansei-wasm = { path = "../.." }
wgpu = { version = "24", features = ["webgpu"] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "KeyboardEvent", "Navigator", "Gamepad", "GamepadButton",
] }
js-sys = "0.3"
log = "0.4"

[workspace]
