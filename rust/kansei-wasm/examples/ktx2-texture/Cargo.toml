[package]
name = "kansei-wasm-ktx2-texture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kansei-core = { path = "../../../kansei-core" }
wgpu = { version = "24", features = ["webgpu"] }
bytemuck = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "Window", "Document",
    "Element", "Performance", "Response", "Location",
] }
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[workspace]
