[package]
name = "kansei-wasm-steering-text"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kansei-core = { path = "../../../kansei-core" }
kansei-wasm = { path = "../.." }
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
