<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kansei — Motion Matching (Kimodo)</title>
    <link rel="icon" href="data:,">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #hud {
            position: fixed; top: 12px; left: 14px; margin: 0; max-width: 60vw;
            color: #f2f2f2; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
            text-shadow: 0 1px 2px #000, 0 0 6px #000; white-space: pre-wrap; pointer-events: none;
        }
        /* the cannon's prompt: shown by the cannon, and a click (or touch) on it fires */
        #prompt {
            position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
            padding: 8px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.55);
            color: #f2f2f2; font: 14px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
            cursor: pointer; user-select: none; touch-action: none;
        }
        #prompt:not([data-visible="1"]) { display: none; }
        /* a pack that isn't linked: what to do about it */
        #missing {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: min(640px, 90vw);
            padding: 18px 22px; border-radius: 8px; background: #1b1b1b; color: #f2f2f2;
            font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
        }
        #missing:empty { display: none; }
        #missing code { color: #ffd479; }
    </style>
</head>
<body>
    <canvas id="kansei" tabindex="0"></canvas>
    <pre id="hud"></pre>
    <div id="prompt"></div>
    <div id="missing"></div>
    <script type="module">
        import init, { start_kimodo, cannon_fire, clip_names, play_clips, set_drive, drive_restart } from '../pkg/kansei_wasm_motion_matching_kimodo.js';
        import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js';

        // The packs, linked into www/pack/ by link-packs.sh (they stay out of git). `params` are
        // what each needs on top of the pack: its paces (walk=, run=, forward m/s) and a second body.
        const PACKS = {
            dance: { label: 'Generated: dance card (SOMA)', url: 'pack/gen/gen-dance.kmm', params: {} },
            all: { label: 'Generated: dance card + custom clips (SOMA)', url: 'pack/gen/gen-all.kmm', params: {} },
            limp: { label: 'Generated: limping on the left leg (SOMA)', url: 'pack/gen/gen-limp.kmm', params: { walk: '1.2', run: '3' } },
            'gasp-gen': { label: 'GASP + generated (mannequin)', url: 'pack/gen/gasp-plus-gen.kmm', params: { hero: 'pack/gasp/hero.kmm', char: 'mannequin' } },
            gasp: { label: 'GASP only, for reference', url: 'pack/gasp/gasp-locomotion.kmm', params: { hero: 'pack/gasp/hero.kmm' } },
        };
        // parameters a pack sets; the rest of the URL (course=, lake=, view=, at=…) carries over
        const PACK_PARAMS = ['pack', 'walk', 'run', 'hero', 'char', 'play', 'drive'];
        // the custom clips, by what they show
        const CUSTOM = { push: /Push/, drag: /Drag/, car: /Car/, parkour: /Parkour\// };

        const urlFor = (id, extra = {}) => {
            const q = new URLSearchParams(location.search);
            for (const k of PACK_PARAMS) q.delete(k);
            q.set('pack', PACKS[id].url);
            for (const [k, v] of Object.entries({ ...PACKS[id].params, ...extra })) q.set(k, v);
            return `${location.pathname}?${q.toString().replace(/%2F/g, '/').replace(/%2C/g, ',').replace(/%2A/g, '*')}`;
        };

        // `pack=<id>` (or none: the dance card) picks a pack and its settings, written out as the
        // pack's URL and parameters the engine reads; `pack=<url>` is any pack, as in the
        // motion-matching example
        const q = new URLSearchParams(location.search);
        const asked = q.get('pack') ?? 'dance';
        let current = Object.keys(PACKS).find((id) => id === asked || PACKS[id].url === asked);
        if (current && asked === current) {
            // expand the id into what the engine reads, keeping whatever else the URL says
            const keep = Object.fromEntries([...q].filter(([k]) => k !== 'pack'));
            history.replaceState(null, '', urlFor(current, keep));
        }
        const packUrl = current ? PACKS[current].url : asked;

        // which packs are linked (a 404 for those that aren't)
        const linked = Object.fromEntries(await Promise.all(Object.entries(PACKS).map(async ([id, p]) => {
            try { return [id, (await fetch(p.url, { method: 'HEAD' })).ok]; } catch { return [id, false]; }
        })));

        await init();
        const prompt = document.getElementById('prompt');
        prompt.addEventListener('pointerdown', (e) => { e.preventDefault(); cannon_fire(true); });
        for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) prompt.addEventListener(ev, () => cannon_fire(false));

        const pane = new Pane({ title: 'Kimodo packs (P to hide)' });
        // typing in the panel doesn't walk the character
        for (const ev of ['keydown', 'keyup']) pane.element.addEventListener(ev, (e) => { if (e.key.toLowerCase() !== 'p') e.stopPropagation(); });
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'p' && !e.repeat && e.target.tagName !== 'INPUT') pane.hidden = !pane.hidden; });

        const packs = pane.addFolder({ title: 'pack' });
        const options = Object.fromEntries(Object.entries(PACKS).map(([id, p]) => [linked[id] ? p.label : `${p.label} — not linked`, id]));
        const choice = { pack: current ?? 'dance' };
        packs.addBinding(choice, 'pack', { label: 'pack', options }).on('change', (ev) => { location.href = urlFor(ev.value); });
        const info = { paces: '', body: '' };
        const paces = (k, d) => q.get(k) ?? PACKS[current]?.params[k] ?? d;
        info.paces = `walk ${paces('walk', 2)} · run ${paces('run', 5)} m/s`;
        info.body = { gasp: 'hero (C: mannequin)', 'gasp-gen': 'mannequin (C: hero)' }[current] ?? 'SOMA (the pack’s own)';
        packs.addBinding(info, 'paces', { readonly: true });
        packs.addBinding(info, 'body', { readonly: true });
        const scene = { course: q.get('course') !== '0', lake: q.get('lake') !== '0' };
        const reload = (k) => (ev) => { const u = new URL(location.href); if (ev.value) u.searchParams.delete(k); else u.searchParams.set(k, '0'); location.href = u; };
        packs.addBinding(scene, 'course', { label: 'course (boxes)' }).on('change', reload('course'));
        packs.addBinding(scene, 'lake').on('change', reload('lake'));

        // a pack that isn't there: say how to link it, and don't start
        const missing = !(current ? linked[current] : (await fetch(packUrl, { method: 'HEAD' }).catch(() => ({ ok: false }))).ok);
        if (missing) {
            document.getElementById('missing').innerHTML =
                `<b>The pack ${packUrl} isn't linked.</b>\n\nThe generated packs are private and stay out of git. Link them into www/pack/:\n\n` +
                `  <code>rust/kansei-wasm/examples/motion-matching-kimodo/link-packs.sh [private-data-dir]</code>\n\n` +
                `(default ~/Documents/dev/kansei-private-data: its genanim/pack/ becomes www/pack/gen/, gasp/pack/ www/pack/gasp/), then reload, or pick a linked pack in the panel. See this example's README.`;
            throw new Error(`pack ${packUrl} not linked`);
        }

        await start_kimodo('kansei');
        window.driveRestart = drive_restart;

        // the clip browser: the custom clips, played as they are from where the character stands
        const names = clip_names();
        const clips = pane.addFolder({ title: 'clips' });
        const status = { playing: q.get('play') ?? (q.get('drive') === '1' ? 'the drive=1 route' : 'the stick') };
        clips.addBinding(status, 'playing', { readonly: true });
        const play = (pattern, label) => {
            set_drive(false);
            const n = play_clips(pattern);
            status.playing = pattern === '' ? 'the stick' : `${label ?? pattern} (${n} clip${n === 1 ? '' : 's'})`;
            pane.refresh();
            document.getElementById('kansei').focus();
        };
        let any = false;
        for (const [kind, re] of Object.entries(CUSTOM)) {
            const ofKind = names.filter((n) => re.test(n));
            if (!ofKind.length) continue;
            any = true;
            // a family is a clip's samples (Push_Heavy_00, _01, …): play them all, or one
            const families = [...new Set(ofKind.map((n) => n.replace(/_\d+$/, '')))];
            const folder = clips.addFolder({ title: kind, expanded: kind !== 'parkour' });
            const pick = { family: families[0], sample: 'all' };
            const samples = () => ofKind.filter((n) => n.replace(/_\d+$/, '') === pick.family);
            folder.addBinding(pick, 'family', { label: 'clip', options: Object.fromEntries(families.map((f) => [f.split('/').pop(), f])) });
            const suffixes = [...new Set(ofKind.map((n) => n.match(/_(\d+)$/)?.[1]).filter(Boolean))].sort();
            folder.addBinding(pick, 'sample', { options: Object.fromEntries([['all', 'all'], ...suffixes.map((x) => [x, x])]) });
            folder.addButton({ title: 'play' }).on('click', () => {
                const list = samples().filter((n) => pick.sample === 'all' || n.endsWith(`_${pick.sample}`));
                if (list.length) play(list.join(','), list.length === 1 ? list[0] : `${pick.family} (all samples)`);
            });
            folder.addButton({ title: `play every ${kind} clip` }).on('click', () => play(ofKind.join(','), `every ${kind} clip`));
        }
        if (!any) clips.addBinding({ custom: 'none in this pack' }, 'custom', { readonly: true });
        const free = { pattern: '' };
        clips.addBinding(free, 'pattern', { label: 'play=' });
        clips.addButton({ title: 'play pattern (* any run, commas)' }).on('click', () => play(free.pattern));
        clips.addButton({ title: 'drive the route (drive=1)' }).on('click', () => {
            play_clips('');
            set_drive(true);
            status.playing = 'the drive=1 route';
            pane.refresh();
        });
        clips.addButton({ title: 'back to the stick' }).on('click', () => { set_drive(false); play('', ''); });
        clips.addButton({ title: 'restart (route or clips)' }).on('click', () => drive_restart());
        // Escape gives the character back to the stick
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { set_drive(false); play('', ''); } });
    </script>
</body>
</html>
