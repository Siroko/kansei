<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kansei — Path Tracer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #fps {
            position: fixed; top: 10px; left: 10px;
            color: #0f0; font: 14px monospace;
            background: rgba(0,0,0,0.6); padding: 4px 8px;
            border-radius: 4px; z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="kansei"></canvas>
    <div id="fps">FPS: --</div>
    <script type="module">
        import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js';
        import init, {
            start,
            set_spp,
            set_max_bounces,
            set_use_blue_noise,
            reset_accumulation,
            get_frame_index,
            set_light_dir,
            set_light_color,
            set_light_intensity,
            set_object_position,
            set_animate,
        } from '../pkg/kansei_wasm_pathtracer.js';

        await init();
        await start('kansei');

        // ── Tweakpane ──────────────────────────────────────────────
        const params = {
            spp: 1,
            maxBounces: 8,
            blueNoise: true,
            frameIndex: 0,
        };

        const pane = new Pane({ title: 'Path Tracer' });

        pane.addBinding(params, 'spp', { min: 1, max: 16, step: 1, label: 'SPP' })
            .on('change', (ev) => set_spp(ev.value));

        pane.addBinding(params, 'maxBounces', { min: 1, max: 16, step: 1, label: 'Max Bounces' })
            .on('change', (ev) => set_max_bounces(ev.value));

        pane.addBinding(params, 'blueNoise', { label: 'Blue Noise' })
            .on('change', (ev) => set_use_blue_noise(ev.value));

        pane.addButton({ title: 'Reset Accumulation' })
            .on('click', () => reset_accumulation());

        const frameMonitor = pane.addBinding(params, 'frameIndex', {
            readonly: true,
            label: 'Frame',
            format: (v) => v.toFixed(0),
        });

        // ── Light ──────────────────────────────────────────────────
        const lightParams = {
            intensity: 3.0,
            direction: { x: -0.3, y: -0.5, z: -1.0 },
            color: { r: 1.0, g: 0.95, b: 0.9 },
        };

        const lightFolder = pane.addFolder({ title: 'Light' });

        lightFolder.addBinding(lightParams, 'intensity', { min: 0, max: 20, step: 0.1 })
            .on('change', (ev) => set_light_intensity(ev.value));

        lightFolder.addBinding(lightParams, 'direction', {
            x: { min: -1, max: 1, step: 0.01 },
            y: { min: -1, max: 1, step: 0.01 },
            z: { min: -1, max: 1, step: 0.01 },
        }).on('change', (ev) => set_light_dir(ev.value.x, ev.value.y, ev.value.z));

        lightFolder.addBinding(lightParams, 'color', { color: { type: 'float' } })
            .on('change', (ev) => set_light_color(ev.value.r, ev.value.g, ev.value.b));

        // ── Scene ──────────────────────────────────────────────────
        // ids: 0 = box A, 1 = box B, 2 = dragon (offset from load position)
        const sceneParams = {
            animate: false,
            boxA: { x: -1.5, y: 1.0, z: 0.0 },
            boxB: { x: 1.5, y: 0.5, z: 0.0 },
            dragon: { x: 0.0, y: 0.0, z: 0.0 },
        };

        const posRange = {
            x: { min: -3.5, max: 3.5, step: 0.05 },
            y: { min: 0, max: 6, step: 0.05 },
            z: { min: -3.5, max: 3.5, step: 0.05 },
        };
        const offsetRange = {
            x: { min: -3.5, max: 3.5, step: 0.05 },
            y: { min: -2, max: 4, step: 0.05 },
            z: { min: -3.5, max: 3.5, step: 0.05 },
        };

        const sceneFolder = pane.addFolder({ title: 'Scene' });

        sceneFolder.addBinding(sceneParams, 'animate', { label: 'Animate Box B' })
            .on('change', (ev) => set_animate(ev.value));

        sceneFolder.addBinding(sceneParams, 'boxA', { label: 'Box A', ...posRange })
            .on('change', (ev) => set_object_position(0, ev.value.x, ev.value.y, ev.value.z));

        sceneFolder.addBinding(sceneParams, 'boxB', { label: 'Box B', ...posRange })
            .on('change', (ev) => set_object_position(1, ev.value.x, ev.value.y, ev.value.z));

        sceneFolder.addBinding(sceneParams, 'dragon', { label: 'Dragon Offset', ...offsetRange })
            .on('change', (ev) => set_object_position(2, ev.value.x, ev.value.y, ev.value.z));

        // ── FPS Counter ────────────────────────────────────────────
        const fpsEl = document.getElementById('fps');
        let lastTime = performance.now();
        let frames = 0;

        function tick() {
            frames++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                const fps = Math.round(frames * 1000 / (now - lastTime));
                fpsEl.textContent = `FPS: ${fps}`;
                frames = 0;
                lastTime = now;
            }
            params.frameIndex = get_frame_index();
            frameMonitor.refresh();
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    </script>
</body>
</html>
