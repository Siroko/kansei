<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Joy Division — Unknown Pleasures</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="kansei"></canvas>
    <script type="module">
        import initWasm, { start, init_text, update_fft, set_fft_amplitude, set_noise_scale, set_noise_strength, set_noise_speed, set_noise_zoom, set_noise_mix, set_wave_thickness, set_peak_exponent, set_temporal_blend, set_fft_pow, set_peak_min, set_text_visible, set_text_offset, set_glyph_rot_x } from './pkg/kansei_wasm_joydivision.js';
        import initArfont, { ArteryFont } from './arfont/artery_font.js';

        await Promise.all([initWasm(), initArfont()]);
        await start('kansei');

        // ── Font ──
        const fontData = await fetch('assets/fonts/L10-medium.arfont').then(r => r.arrayBuffer());
        const fontInfo = ArteryFont.read_from_bytes(new Uint8Array(fontData));
        const atlas = fontInfo.images[0];
        const aw = atlas.width, ah = atlas.height;
        const glyphs = fontInfo.variants[0].glyphs.map(g => ({
            codepoint: g.codepoint,
            advance: g.advance.horizontal,
            image_bounds: [g.image_bounds.left/aw, g.image_bounds.top/ah, g.image_bounds.right/aw, g.image_bounds.bottom/ah],
            plane_bounds: [g.plane_bounds.left, g.plane_bounds.top, g.plane_bounds.right, g.plane_bounds.bottom],
        }));

        // ── Lyrics ──
        const lyrics = await fetch('lyrics.json').then(r => r.json());

        init_text(
            JSON.stringify(lyrics.lines.map(l => l.text)),
            JSON.stringify(glyphs),
            new Uint8ClampedArray(atlas.data), aw, ah,
            JSON.stringify(lyrics.lines.map(l => l.time)),
        );

        // ── Audio (fetch + decodeAudioData — works with any static server) ──
        let audioCtx, analyser, fftRaw, fftSmoothed;
        let playing = false;
        let startTime = 0;
        let pausedAt = 0;
        let bufferSource = null;
        let audioBuffer = null;

        // Pre-fetch the audio file so playback starts instantly on click
        const audioData = await fetch(lyrics.audio).then(r => r.arrayBuffer());

        const canvas = document.getElementById('kansei');
        canvas.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                fftRaw = new Uint8Array(analyser.fftSize);
                fftSmoothed = new Float32Array(256); // always 256 bins for the shader
                for (let i = 0; i < 256; i++) fftSmoothed[i] = 128; // silence
                audioBuffer = await audioCtx.decodeAudioData(audioData);
            }

            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (!playing) {
                // Start or resume from pausedAt
                bufferSource = audioCtx.createBufferSource();
                bufferSource.buffer = audioBuffer;
                bufferSource.connect(analyser);
                analyser.connect(audioCtx.destination);
                bufferSource.start(0, pausedAt);
                startTime = audioCtx.currentTime - pausedAt;
                playing = true;
                bufferSource.onended = () => {
                    playing = false;
                    pausedAt = 0;
                };
            } else {
                // Pause
                pausedAt = audioCtx.currentTime - startTime;
                bufferSource.stop();
                playing = false;
            }
        });

        function currentTime() {
            if (!playing) return pausedAt;
            return audioCtx.currentTime - startTime;
        }

        // ── Tweakpane ──
        const { Pane } = await import('https://cdn.jsdelivr.net/npm/tweakpane@4/dist/tweakpane.min.js');
        const pane = new Pane({ title: 'Joy Division', expanded: false });
        const p = {
            fftAmplitude: 17, fftSize: 256, blur: 7, lineThickness: 0.44,
            peakExponent: 15.2, peakMin: 0.08, temporalBlend: 0.70, fftPow: 2.0,
            noiseScale: 0.09, noiseStrength: 1.30, noiseSpeed: 0.4, noiseZoom: 0.6, noiseMix: 1.0,
            showText: true, textOffsetX: 0, textOffsetY: 0, textOffsetZ: 1, glyphRotX: 90,
        };
        pane.addBinding(p, 'fftAmplitude', { min: 0, max: 512, step: 1, label: 'displacement' })
            .on('change', () => set_fft_amplitude(p.fftAmplitude));
        pane.addBinding(p, 'fftSize', {
            label: 'resolution',
            options: { '64': 64, '128': 128, '256': 256, '512': 512, '1024': 1024, '2048': 2048 },
        }).on('change', () => { if (analyser) analyser.fftSize = p.fftSize; });
        pane.addBinding(p, 'blur', { min: 0, max: 32, step: 1, label: 'smoothing' });
        pane.addBinding(p, 'lineThickness', { min: 0.01, max: 2, step: 0.01, label: 'line thickness' })
            .on('change', () => set_wave_thickness(p.lineThickness));
        pane.addBinding(p, 'peakExponent', { min: 0, max: 20, step: 0.1, label: 'peak shape' })
            .on('change', () => set_peak_exponent(p.peakExponent));
        pane.addBinding(p, 'peakMin', { min: 0, max: 0.5, step: 0.01, label: 'edge floor' })
            .on('change', () => set_peak_min(p.peakMin));
        pane.addBinding(p, 'temporalBlend', { min: 0.01, max: 1.0, step: 0.01, label: 'responsiveness' })
            .on('change', () => set_temporal_blend(p.temporalBlend));
        pane.addBinding(p, 'fftPow', { min: 0.01, max: 9.0, step: 0.01, label: 'fft curve' })
            .on('change', () => set_fft_pow(p.fftPow));
        pane.addBinding(p, 'noiseMix', { min: 0, max: 1, step: 0.01, label: 'fft / noise' })
            .on('change', () => set_noise_mix(p.noiseMix));
        pane.addBinding(p, 'noiseScale', { min: 0, max: 2, step: 0.01, label: 'noise scale' })
            .on('change', () => set_noise_scale(p.noiseScale));
        pane.addBinding(p, 'noiseStrength', { min: 0, max: 5, step: 0.01, label: 'noise amp' })
            .on('change', () => set_noise_strength(p.noiseStrength));
        pane.addBinding(p, 'noiseSpeed', { min: 0, max: 10, step: 0.1, label: 'noise speed' })
            .on('change', () => set_noise_speed(p.noiseSpeed));
        pane.addBinding(p, 'noiseZoom', { min: 0.1, max: 5, step: 0.1, label: 'noise zoom' })
            .on('change', () => set_noise_zoom(p.noiseZoom));

        // ── Text ──
        const textFolder = pane.addFolder({ title: 'Text', expanded: false });
        textFolder.addBinding(p, 'showText', { label: 'visible' })
            .on('change', () => set_text_visible(p.showText));
        textFolder.addBinding(p, 'textOffsetX', { min: -20, max: 20, step: 0.1, label: 'offset X' })
            .on('change', () => set_text_offset(p.textOffsetX, p.textOffsetY, p.textOffsetZ));
        textFolder.addBinding(p, 'textOffsetY', { min: -20, max: 20, step: 0.1, label: 'offset Y' })
            .on('change', () => set_text_offset(p.textOffsetX, p.textOffsetY, p.textOffsetZ));
        textFolder.addBinding(p, 'textOffsetZ', { min: -10, max: 10, step: 0.1, label: 'offset Z' })
            .on('change', () => set_text_offset(p.textOffsetX, p.textOffsetY, p.textOffsetZ));
        textFolder.addBinding(p, 'glyphRotX', { min: 0, max: 180, step: 1, label: 'glyph rot X' })
            .on('change', () => set_glyph_rot_x(p.glyphRotX));

        // ── Render + FFT loop ──
        function loop() {
            requestAnimationFrame(loop);
            const t = currentTime();
            if (analyser && playing) {
                // Resize raw buffer if fftSize changed
                if (fftRaw.length !== analyser.fftSize) {
                    fftRaw = new Uint8Array(analyser.fftSize);
                }
                analyser.getByteTimeDomainData(fftRaw);

                // Resample raw (fftSize samples) → 256 bins
                const rawLen = fftRaw.length;
                for (let i = 0; i < 256; i++) {
                    const srcIdx = (i / 255) * (rawLen - 1);
                    const lo = Math.floor(srcIdx);
                    const hi = Math.min(lo + 1, rawLen - 1);
                    const frac = srcIdx - lo;
                    fftSmoothed[i] = fftRaw[lo] * (1 - frac) + fftRaw[hi] * frac;
                }

                // Spatial blur: box filter of radius p.blur for rounded curves
                const outBuf = new Uint8Array(256);
                const r = p.blur;
                if (r > 0) {
                    for (let i = 0; i < 256; i++) {
                        let sum = 0, count = 0;
                        const lo = Math.max(0, i - r);
                        const hi = Math.min(255, i + r);
                        for (let j = lo; j <= hi; j++) { sum += fftSmoothed[j]; count++; }
                        outBuf[i] = Math.round(sum / count);
                    }
                } else {
                    for (let i = 0; i < 256; i++) outBuf[i] = Math.round(fftSmoothed[i]);
                }
                update_fft(outBuf, t);
            } else {
                update_fft(new Uint8Array(256), t);
            }
        }
        loop();
    </script>
</body>
</html>
