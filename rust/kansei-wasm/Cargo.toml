[package]
name = "kansei-wasm"
version = "0.1.0"
edition = "2021"
description = "Kansei engine — web runtime shared by the WASM examples"

[dependencies]
kansei-core = { path = "../kansei-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Location", "Navigator", "Performance",
    "Response", "UrlSearchParams", "ResizeObserver", "HtmlElement", "HtmlInputElement", "EventTarget", "KeyboardEvent",
    "Gamepad", "GamepadButton",
] }
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
