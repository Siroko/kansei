[package]
name = "kansei-wasm-fluid-clock"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kansei-core = { path = "../../../kansei-core" }
kansei-wasm = { path = "../.." }
wgpu = "24"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext", "AudioDestinationNode", "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }
js-sys = "0.3"
log = "0.4"

[workspace]
